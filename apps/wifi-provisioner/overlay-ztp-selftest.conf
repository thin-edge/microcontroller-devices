#
# ZTP p256 crypto self-test at boot (ztp-ble-provisioner, spike tasks 1.1/1.3).
# Pass it to the provisioner image of a sysbuild build:
#
#   west build --sysbuild -b <board> apps/<app> -- \
#     -Dwifi-provisioner_EXTRA_CONF_FILE=$PWD/apps/wifi-provisioner/overlay-ztp-selftest.conf
#
# It links in the whole crypto stack the ZTP protocol needs, so the image size
# it produces is the honest cost of the suite, not a guess.

CONFIG_APP_PROV_ZTP_CRYPTO_SELFTEST=y

# The identity key persists in PSA ITS through settings, as in the tedge
# profiles.
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y

# No dedicated Mbed TLS heap: PSA allocates from the libc heap, as the
# Bluetooth host's own PSA use already does. A dedicated 8 KB heap cost the
# WROOM-32 8 KB of dram0, which is at 90% before ZTP.

