#
# Spike E (c8y-direct-spikes section 9): the provisioner with a SoftAP captive
# portal instead of Improv over BLE. Pass to the provisioner image with the
# devicetree overlay softap.overlay, e.g. in a sysbuild build of an app:
#   -Dwifi-provisioner_EXTRA_CONF_FILE=.../overlay-softap.conf
#   -Dwifi-provisioner_EXTRA_DTC_OVERLAY_FILE=.../softap.overlay

CONFIG_BT=n
CONFIG_APP_WIFI_PROV_SOFTAP=y

# AP + station at the same time (the station tests the credentials).
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# DHCP server on the AP; the phone's DNS server is the device itself.
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_OPTION_DNS_ADDRESS="192.168.4.1"

# HTTP form.
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONN=6
CONFIG_ZVFS_OPEN_MAX=10
CONFIG_ZVFS_POLL_MAX=6
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=6144
