# SPDX-License-Identifier: Apache-2.0
#
# Provision over the lab-ztp-provisioner BLE protocol instead of Improv:
# Wi-Fi credentials plus Cumulocity onboarding in one session. The server
# profile must select `crypto: {suite: p256}`. Pass it to the provisioner image
# of a sysbuild build:
#
#   west build --sysbuild -b <board> apps/<app> -- \
#     -Dwifi-provisioner_EXTRA_CONF_FILE=$PWD/apps/wifi-provisioner/overlay-ztp.conf

CONFIG_APP_PROV_ZTP=y

# The device's ZTP identity key persists in PSA ITS through settings, the same
# store the tedge profiles use for the Cumulocity key.
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y
