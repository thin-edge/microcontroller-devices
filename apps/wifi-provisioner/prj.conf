# SPDX-License-Identifier: Apache-2.0
#
# Wi-Fi provisioner: Improv Wi-Fi over BLE, Wi-Fi to test the credentials, and
# the credential store the application reads. No protocol frontend and no mDNS.
# The Wi-Fi driver itself is selected per board (boards/<board>.conf).

CONFIG_APP_FIRMWARE_NAME="wifi-provisioner"
CONFIG_APP_WIFI_PROVISIONER=y
CONFIG_APP_WIFI_CRED_STORE=y
# Waiting for credentials is "offline" by design: no last-resort reboot. The
# liveness watchdog stays (default on), so a wedged driver still resets the
# device, and the boot request brings it back here.
CONFIG_APP_NET_RECONNECT_REBOOT=n

# --- Bluetooth: one peripheral connection, no pairing ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=0
CONFIG_BT_SMP=n
# The advertised name is the application's hostname, set at runtime.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32
# One Improv "send Wi-Fi settings" frame is at most 101 bytes. A larger ATT MTU
# lets it arrive in a single write; the prepare queue covers clients that use a
# long (queued) write instead.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_ATT_PREPARE_COUNT=2
# Wi-Fi/BLE software coexistence (ESP32_SW_COEXIST_ENABLE) defaults on once
# both radios are enabled; the credential test runs Wi-Fi while BLE is up.

# --- Networking: a station that can get a DHCP address, nothing more ---
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y
# Fallback BLE name before any application has run: tedge-prov<mac>.
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="tedge-prov"
CONFIG_NET_HOSTNAME_UNIQUE=y

# --- Button (sw0) ---
CONFIG_GPIO=y
CONFIG_REBOOT=y

# --- Runtime / logging ---
CONFIG_LOG=y
# Warnings and errors only. The provisioner's logs serve provisioning alone,
# and its 1 MB prov partition was 96.8 % full on the ESP32-C6 with the ZTP
# overlay: level 2 drops the info strings and their call sites, and the
# flash-mapped code then ends before a 64 KB image boundary, which is where
# the size actually moves (scripts/release/size.py reports content and
# padding). The provisioning steps still report on the console at warning
# level where something goes wrong (reduce-memory-footprint, tier 3).
CONFIG_LOG_DEFAULT_LEVEL=2
# Minimal log mode (messages go straight to the console through printk: no
# deferred log core, packaging or UART backend, no timestamps) and the nano
# formatter, which does all the printing here. Together with level 2 they
# take 12.6 KB of content off the C6 ZTP provisioner and, decisively, move
# its flash-mapped code below a 64 KB image boundary: 1,015,243 -> 948,346 B
# (96.8 -> 90.4 % of prov, measured 2026-09-22). That code now ends 32 B
# before the boundary, so a few hundred bytes of growth put the image back
# at 96.7 %; the release size gate (92 % budget) is what catches it.
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CBPRINTF_NANO=y
# CBPRINTF_NANO also makes picolibc's printf family default to its minimal
# level, which ignores width and zero padding: snprintf("%02u") printed "9",
# the ZTP request timestamp came out as 2026-9-23T5:54:40Z and the server
# rejected it (found on the WROOM, 2026-09-23). The integer level formats
# width, padding and precision; only the logs use the nano formatter.
CONFIG_PICOLIBC_IO_INTEGER=y
CONFIG_MAIN_STACK_SIZE=4096
# The system heap is not set: the Wi-Fi and Bluetooth drivers' minimums win
# over any smaller value, and the provisioner resolves to 80,896 B on the
# ESP32 and ESP32-S3 and 105,296 B on the ESP32-C6 whatever is written here.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
