# SPDX-License-Identifier: Apache-2.0
#
# Board-agnostic application configuration. Wi-Fi/stack specifics live in
# boards/<board>.conf; the client's feature set in a tedge-zephyr profile and
# its board sizing in lib/common/tedge-boards/, both passed as
# EXTRA_CONF_FILE. What is here is enough for the client to connect on its
# own; the profile adds to it.

# --- Firmware identity ---
CONFIG_APP_DEVICE_NAME="tedge-agent-device"
CONFIG_APP_FIRMWARE_NAME="zephyr-tedge-agent"

# --- The client: this application exists to run it ---
CONFIG_TEDGE=y
CONFIG_TEDGE_TRANSPORT_C8Y=y
CONFIG_TEDGE_C8Y_MQTT_SERVICE=y
CONFIG_TEDGE_AUTH_C8Y_CA=y
CONFIG_TEDGE_RESTART=y
CONFIG_TEDGE_HEALTH=y
CONFIG_TEDGE_TELEMETRY=y

# What the application must provide for the client (tedge-zephyr/README.md).
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y

# Free system heap in the device's own telemetry.
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Runtime / memory ---
# main() only starts the client and returns; the client runs on its own
# threads. On the WROOM every KB of DRAM counts.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_POSIX_API=y

# --- Networking (BSD sockets API; stack specifics per board) ---
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=y
