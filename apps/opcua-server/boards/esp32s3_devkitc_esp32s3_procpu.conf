# SPDX-License-Identifier: Apache-2.0
#
# ESP32-S3-DevKitC-1 (Espressif reference board; dual-core Xtensa LX7, 512 KB
# SRAM). The board in hand is an N16R8: 16 MB flash and 8 MB octal PSRAM,
# though the board devicetree assumes an N8 and no PSRAM is enabled here.
# Build target: esp32s3_devkitc/esp32s3/procpu.
#
# Mirrors the Adafruit QT Py ESP32-S3 config, which is verified on hardware and
# is near-identical silicon. Two deliberate differences from that port:
#   * No &wifi overlay. This board devicetree already sets the Wi-Fi node to
#     "okay", so CONFIG_WIFI_ESP32 can be selected directly.
#   * The console stays on uart0, the board's own choice, which comes out on the
#     board's UART port. That port's bridge wires DTR/RTS to EN/BOOT, so esptool
#     resets it into download mode by itself — flashing needs no button press and
#     boot output is not lost to a USB re-enumeration. The sibling .overlay only
#     corrects the declared flash size (this board is an N16R8, not the N8 the
#     board devicetree assumes).
#
# No status LED: the board carries a WS2812 addressable RGB LED, not the plain
# GPIO led0 alias that lib/common/status_led.c drives, so the indicator is a
# no-op here (see the "No LED present" scenario in the wifi-connectivity spec).
# Connectivity state is read from the console log.

# --- Wi-Fi driver ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_APP_WIFI=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y

# open62541 uses the libc malloc arena (sized "all remaining RAM"): what
# the system heap takes is gone from that arena.
# The system heap is not set: the Wi-Fi driver's minimum (51,200 B) wins
# over any smaller CONFIG_HEAP_MEM_POOL_SIZE, so this board's images get
# about 55 KB of system heap whatever is written here (the exact sum of the
# drivers' minimums varies a little with the options built).

# --- IP stack ---
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y

# --- mDNS / DNS-SD advertisement ---
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="tedge-opcua"
CONFIG_NET_HOSTNAME_UNIQUE=y
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y

# Socket / connection headroom, sized with margin so a burst of client
# (re)connections cannot exhaust contexts/file descriptors (which would wedge
# the event loop). Matches the WROOM tuning that survives the churn stress.
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_MAX_CONN=10
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_NET_TCP_TIME_WAIT_DELAY=250

# --- Net buffer pools (deep enough that connection bursts don't starve the
#     Wi-Fi driver of RX buffers) ---
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=40
CONFIG_NET_BUF_TX_COUNT=32

# --- Thread stacks (measured with the thread analyzer on an ESP32-CAM) ---
# The system workqueue peaks at ~770 B of its 1 KB default; an overflow
# silently corrupts memory and stalls the firmware. (The connectivity work that
# overflowed it now runs on its own queue: CONFIG_APP_NET_WORKQ_STACK_SIZE. The
# log thread's stack is raised in lib/common/Kconfig, because the option only
# exists with deferred logging.)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- Socket service poll set ---
# The socket service thread (mDNS responder, DNS-SD) polls 4 sockets here. With
# the default of 3 it logs "Please increase CONFIG_ZVFS_POLL_MAX" and never
# starts, so the device stops answering mDNS.
CONFIG_ZVFS_POLL_MAX=6
# Once it runs, the service thread (mDNS responder) peaks at ~1.4 KB: 16 bytes
# short of its 1408-byte default. Give it headroom.
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=2400
