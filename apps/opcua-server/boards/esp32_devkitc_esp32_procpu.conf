# SPDX-License-Identifier: Apache-2.0
#
# ESP32-WROOM-32 (co-primary target): Wi-Fi station + native IP stack + mDNS.

# Allow running on older ESP32 silicon (e.g. WROOM-32 chip revision v1.0),
# which the v4.4 bootloader otherwise refuses to boot.
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

# --- Wi-Fi driver ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_APP_WIFI=y

# open62541 allocates via libc malloc, whose arena is "all remaining RAM"
# (CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1): what the system heap takes is
# gone from that arena.
# The system heap is not set: the Wi-Fi driver's minimum (51,200 B) wins
# over any smaller CONFIG_HEAP_MEM_POOL_SIZE, so this board's images get
# about 55 KB of system heap whatever is written here (the exact sum of the
# drivers' minimums varies a little with the options built).
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y

# --- IP stack ---
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y

# --- mDNS / DNS-SD advertisement ---
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="tedge-opcua"
CONFIG_NET_HOSTNAME_UNIQUE=y
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y

# Socket / connection headroom for the OPC-UA server. Sized with margin so a
# burst of client (re)connections does not exhaust contexts/file descriptors —
# which would make the event loop's select() fail with ENOMEM and wedge the
# whole network stack (see the connection-churn stress test).
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_MAX_CONN=10
CONFIG_ZVFS_OPEN_MAX=16

# Free closed TCP connections quickly (default 1500 ms). A collector that
# reconnects frequently otherwise leaves many contexts pinned in TIME_WAIT.
CONFIG_NET_TCP_TIME_WAIT_DELAY=250

# --- RAM budget tuning (WROOM-32 has no PSRAM) ---
# The Wi-Fi stack and open62541 share ~300 KB of SRAM. These pools must be deep
# enough that a burst of client (re)connections does not starve the Wi-Fi driver
# of RX net buffers ("esp32_wifi: Failed to allocate net buffer"), which would
# otherwise wedge the network path. Sized with margin (verified via the
# connection-churn stress test) while still leaving heap for open62541.
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=40
CONFIG_NET_BUF_TX_COUNT=32

# --- Thread stacks (measured with the thread analyzer on an ESP32-CAM) ---
# The system workqueue peaks at ~770 B of its 1 KB default; an overflow
# silently corrupts memory and stalls the firmware. (The connectivity work that
# overflowed it now runs on its own queue: CONFIG_APP_NET_WORKQ_STACK_SIZE. The
# log thread's stack is raised in lib/common/Kconfig, because the option only
# exists with deferred logging.)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- Socket service poll set ---
# The socket service thread (mDNS responder, DNS-SD) polls 4 sockets here. With
# the default of 3 it logs "Please increase CONFIG_ZVFS_POLL_MAX" and never
# starts, so the device stops answering mDNS.
CONFIG_ZVFS_POLL_MAX=6
# Once it runs, the service thread (mDNS responder) peaks at ~1.4 KB: 16 bytes
# short of its 1408-byte default. Give it headroom.
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=2400

# --- .noinit in DRAM region 1 (SRAM1), also under MCUboot ---
# Simple boot puts .noinit (thread stacks, net buffers; ~68 KB here) in the
# SRAM1 region a second-stage bootloader would use. Zephyr turns that off for
# MCUboot builds, which moves it into region 0 and takes it out of the libc
# heap (70 KB → 3 KB for OPC-UA). .noinit is never loaded, so MCUboot is done
# with that RAM by the time the application uses it.
CONFIG_ESP32_REGION_1_NOINIT=y
