#
# Board-agnostic application configuration. Networking stack specifics and
# Wi-Fi live in boards/<board>.conf; secrets live in a git-ignored overlay
# (see overlay-wifi-credentials.conf.example).

# --- Firmware identity (paired with the VERSION file → FirmwareVersion) ---
CONFIG_APP_FIRMWARE_NAME="zephyr-opcua-server"

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Runtime / memory ---
# main() starts the network, the protocol server and the client, then
# returns; nothing runs on its stack afterwards (the agent measured 1.2 KB
# at 4 KB). Confirm with the thread analyzer (wroom-stackinfo.local.conf)
# when the release workloads change.
CONFIG_MAIN_STACK_SIZE=4096
# The system heap (CONFIG_HEAP_MEM_POOL_SIZE) is not set: on every ESP32
# board the Wi-Fi driver's minimum (51,200 B) wins over any smaller value,
# so the image gets about 55 KB whatever is written here. See the board
# settings files for the size each board resolves to.
# open62541 is built for the POSIX architecture (getaddrinfo, select,
# gethostname, ...), so this image keeps the POSIX layer.
CONFIG_POSIX_API=y

# --- Networking (BSD sockets API; stack specifics per board) ---
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=y
