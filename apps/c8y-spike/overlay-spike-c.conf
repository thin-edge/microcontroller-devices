#
# Spike C: Cumulocity CA enrollment on the device. Use on top of
# overlay-spike-a.conf (and overlay-spike-b.conf for the shell).

CONFIG_SPIKE_AUTH_ENROLLED=y

# --- The device key: persistent in PSA ITS, stored via settings ---
CONFIG_SECURE_STORAGE=y
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y

# --- CSR, key export (for tls_credentials), PKCS#7 unwrap, EST over HTTPS ---
CONFIG_MBEDTLS_X509_CSR_WRITE_C=y
CONFIG_MBEDTLS_PEM_WRITE_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y
CONFIG_MBEDTLS_BASE64_C=y
CONFIG_MBEDTLS_ASN1_PARSE_C=y
CONFIG_HTTP_CLIENT=y

# Enrollment runs on the MQTT thread (CSR signing + an HTTPS handshake).
CONFIG_SPIKE_MQTT_STACK_SIZE=12288

# The CSR and the registration URL are logged in a burst; the default log
# buffer dropped them ("--- 17 messages dropped ---").
CONFIG_LOG_BUFFER_SIZE=16384
