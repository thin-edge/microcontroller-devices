# Task 4.6: download a GitHub release asset (one 302 to another host).
# github.com's chain: ECDSA leaf (P-256) <- Sectigo E36 <- Sectigo E46
# (P-384, cross-signed by USERTrust ECC with ecdsa-with-SHA384).
# The asset host: RSA chain to ISRG Root X1.
CONFIG_SPIKE_OTA_EXTRA_CAS=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=6
# ECDSA P-384 in software takes ~11 s for github.com's chain on the C6;
# Zephyr's default 10 s TLS connect timeout cuts the handshake off.
CONFIG_NET_SOCKETS_TLS_CONNECT_TIMEOUT=30000
