# SPDX-License-Identifier: Apache-2.0
#
# Spike A: MQTTS to Cumulocity. Pass as an EXTRA_CONF_FILE, together with a
# git-ignored overlay that sets CONFIG_SPIKE_C8Y_HOST. Building without this
# overlay gives the baseline the footprint is measured against.

CONFIG_SPIKE_TLS_MQTT=y

# --- MQTT over TLS ---
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MQTT_KEEPALIVE=60
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
# Headroom over the C6 board's 6/8: a closed TLS connection holds its TCP
# context until the close completes, so reconnects one second apart ran out
# after three cycles ("Not enough connection contexts").
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=4

# --- Name resolution and time (certificates can't be checked without it) ---
CONFIG_DNS_RESOLVER=y
CONFIG_SNTP=y

# --- mbedTLS ---
# A dedicated heap with statistics, so TLS memory is measured directly
# (mbedtls_memory_buffer_alloc_max_get). Sized generously for measuring.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=98304
CONFIG_MBEDTLS_MEMORY_DEBUG=y
# 16 KB records first (task 3.2); task 3.6 retries with 4096, which makes
# Zephyr offer max-fragment-length 4096 automatically.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
# Zephyr 4.4 (TF-PSA-Crypto): pick ciphersuites; each selects the PSA
# algorithms it needs. ECDHE-RSA matches the server's RSA certificate;
# ECDHE-ECDSA brings ECDSA, which the device needs to sign with its P-256
# client key.
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y

# --- The MQTT thread does the TLS handshake on its own stack ---
CONFIG_SPIKE_MQTT_STACK_SIZE=10240
# Stack headroom measurement (k_thread_stack_space_get)
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# The restart marker lives in settings (on storage_partition via NVS)
CONFIG_SETTINGS=y
