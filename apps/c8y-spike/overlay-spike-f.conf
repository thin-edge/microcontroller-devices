#
# Spike F: Cumulocity Cloud Remote Access through the device. Use on top of
# overlay-spike-a.conf (+ -b for the shell, + -c for the enrolled identity).

CONFIG_SPIKE_REMOTE_ACCESS=y

CONFIG_WEBSOCKET_CLIENT=y
CONFIG_HTTP_CLIENT=y
# MQTT + the remote-access WebSocket (+ one more for a second request).
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=3

# Zephyr's WebSocket client hashes Sec-WebSocket-Accept with PSA SHA-1 but
# does not select it; without this, websocket_connect() fails with -EPROTO
# before sending anything.
CONFIG_PSA_WANT_ALG_SHA_1=y
