#
# ESP32-S3-DevKitC-1 N16R8 only: use the 8 MB octal PSRAM (task 8.x follow-up).
#
# Internal DRAM runs out from +C on the S3 (section 8). The S3 linker script
# already places `.mbedtls_heap` in PSRAM (`.ext_ram.data`), so moving the
# static mbedTLS heap out of internal RAM only takes the custom section.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_TYPE_ESPPSRAM64=y
CONFIG_MBEDTLS_HEAP_CUSTOM_SECTION=y
