# SPDX-License-Identifier: Apache-2.0
#
# ESP32-WROOM-32 as a "thin-edge.io light" remote-access enabler: no protocol
# app, no OTA, no shell. Use last, on top of -a (+ -c) + -f. Trims the
# spike's measuring headroom back to what one MQTT session plus one tunnel
# needs.

# One TLS record buffer of 8 KB each way (8 KB is the smallest that
# completes the 9883 handshake, section 3) and a TLS heap for MQTT plus one
# tunnel: with 8 KB records MQTT holds 18.5 KB connected and the tunnel's
# handshake peaks at 35.4 KB (section 3), 54 KB together.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=8192
CONFIG_MBEDTLS_HEAP_SIZE=57344

# No shell: a smaller log buffer is enough.
CONFIG_LOG_BUFFER_SIZE=4096

# The MQTT thread peaks at 2.6–3.0 KB (MEAS stack, Spikes A and C, including
# the mTLS handshake). 6 KB keeps 2× headroom; the first-boot CSR/enroll path
# on this thread is unmeasured, so check "MEAS stack" on the first boot.
CONFIG_SPIKE_MQTT_STACK_SIZE=6144

# Net buffers: at the board's 32 RX / 24 TX (128 B each), bursts of SSH through
# the tunnel exhausted the TX pool ("Data buffer allocation failed", "TCP
# failed to allocate buffer in retransmission"): the tunnel stalled and the
# MQTT session dropped. The pools live in SRAM1 .noinit
# (CONFIG_ESP32_REGION_1_NOINIT), not in the dram0 that bounds the TLS heap.
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16

# dram0 is what bounds the TLS heap here, and 51 KB of it is the system heap
# the ESP32 Wi-Fi driver reserves (HEAP_MEM_POOL_ADD_SIZE_ESP_WIFI, not
# settable). Without this, A+C+F overflows dram0 by 8.5 KB. Fewer dynamic
# Wi-Fi buffers let the heap shrink to 44 KB; throughput with them is poor
# (P13), so this trade is still open.
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_HEAP_MEM_POOL_SIZE=45056
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=16
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=16
