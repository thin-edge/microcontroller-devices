#
# Spike B: firmware update into slot1. Use on top of overlay-spike-a.conf
# (it reuses its TLS credentials, clock and MQTT connection).

CONFIG_SPIKE_OTA=y

# --- Download ---
CONFIG_HTTP_CLIENT=y

# --- Write slot1 and drive MCUboot ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# --- Shell on the console: `spike ota get|confirm|status`, `spike reboot`.
# `get` runs the download (and an HTTPS handshake) on the shell thread.
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=10240

# --- Network buffers ---
# Raised while chasing MQTT drops during downloads, which turned out to be a
# second board using the same MQTT client ID (see design.md, Spike B). The
# successful Cumulocity firmware update (task 4.5) ran with these values;
# whether the C6 board defaults (32 x 128 B RX, 8 RX / 8 TX packets) are
# enough for a download next to MQTT is untested.
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=8192
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=64
