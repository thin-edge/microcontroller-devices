#
# Used only by `west build --sysbuild` (boards with BLE Wi-Fi provisioning; see
# sysbuild/provisioning.cmake): MCUboot with A/B slots and swap-with-scratch.
# Images are signed with MCUboot's PUBLIC development key (the default key
# file): fine for development, never for production devices.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
