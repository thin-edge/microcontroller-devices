# Task 6.7: a local remote-access target, Zephyr's shell over telnet.
CONFIG_SHELL_BACKEND_TELNET=y
CONFIG_SHELL_TELNET_PORT=23
# The telnet backend is one more socket-service entry: with the board's 6,
# the socket-service thread refuses to run at all ("7 services to monitor
# but 6 poll entries"), which also stops the mDNS responder.
CONFIG_ZVFS_POLL_MAX=10
# No loopback interface: with CONFIG_NET_LOOPBACK (+ NET_DRIVERS) outbound
# SNTP failed (-101, then -116 timeouts) and the device never connected.
# The target is the device's own LAN address instead of 127.0.0.1.
