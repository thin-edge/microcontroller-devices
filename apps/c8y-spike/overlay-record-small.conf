# Task 3.6: smaller TLS buffers. Below 16 KB, Zephyr offers
# max-fragment-length 4096, and Cumulocity honours it: records are at most
# 4096 bytes. But mbedTLS reassembles a handshake message inside the input
# buffer, so the buffer must still hold the largest handshake message:
#   9883: Certificate chain 5,883 B  -> 4096 fails ("requesting more data
#         than fits"), 6144 is the smallest round size that works
#   8883: CertificateRequest 12,919 B (166 CA names) -> needs 16384
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=8192
