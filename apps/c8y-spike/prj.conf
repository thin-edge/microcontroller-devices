# SPDX-License-Identifier: Apache-2.0
#
# Board-agnostic configuration for the c8y-direct spike firmware. Wi-Fi and
# stack specifics live in boards/<board>.conf; secrets in git-ignored overlays
# at the repo root (overlay-wifi-credentials.conf, c8y.local.conf).

# --- Firmware identity + simulation (feeds the spike's telemetry) ---
CONFIG_APP_FIRMWARE_NAME="zephyr-c8y-spike"
CONFIG_APP_SIM_ENVIRONMENT=y

# --- DNS-SD: the spike serves nothing; this only keeps <hostname>.local ---
# --- resolvable and names the firmware in the provisioner hand-off.      ---
CONFIG_APP_DNSSD_SERVICE_TYPE="_tedge-spike"
CONFIG_APP_DNSSD_PORT=9

# --- tedge-zephyr: only the skeleton exists; spike code lives in src/ ---
CONFIG_TEDGE=y
CONFIG_TEDGE_EXPERIMENTAL_FEATURES=y

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Runtime / memory ---
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_POSIX_API=y

# --- Networking (BSD sockets API; stack specifics per board) ---
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=y
