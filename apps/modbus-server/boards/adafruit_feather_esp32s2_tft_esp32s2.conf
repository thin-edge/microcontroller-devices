# SPDX-License-Identifier: Apache-2.0
#
# Adafruit Feather ESP32-S2 TFT for the Modbus TCP server: single-core Xtensa
# LX7 Wi-Fi with 2 MB PSRAM and a built-in TFT. Build target:
# adafruit_feather_esp32s2_tft/esp32s2.
#
# NOTE: the S2 Feather locks up under this Zephyr (see the project's ESP32-S2
# Wi-Fi note); prefer the ESP32-WROOM or the QT Py ESP32-S3 for real work.

# --- Wi-Fi driver ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_APP_WIFI=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y

# The system heap is not set: the Wi-Fi driver's minimum (51,200 B) wins
# over any smaller CONFIG_HEAP_MEM_POOL_SIZE, so this board's images get
# about 55 KB of system heap whatever is written here (the exact sum of the
# drivers' minimums varies a little with the options built).

# --- IP stack ---
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y

# --- mDNS / DNS-SD advertisement (service type/port set in prj.conf: _modbus/502) ---
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="tedge-modbus"
CONFIG_NET_HOSTNAME_UNIQUE=y
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y

# --- Built-in TFT status display (ST7789 over MIPI-DBI SPI) ---
CONFIG_APP_DISPLAY_STATUS=y
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_ST7789V=y
CONFIG_ST7789V_RGB565=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_POWER_DOMAIN=y

# --- Socket / net buffer budget (single Modbus client; keep some headroom) ---
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=6
CONFIG_ZVFS_OPEN_MAX=12
CONFIG_NET_TCP_TIME_WAIT_DELAY=250
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
# The RX pool bottomed out at 4 free of 24 over a 10 h soak (0 free in an
# earlier one), the tightest resource on these builds. 32 keeps a margin; the
# OPC-UA firmware, which carries more traffic, uses 40.
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=24

# --- Thread stacks ---
# The system workqueue overflows its 1 KB default on ESP32 Wi-Fi builds, which
# silently corrupts memory and stalls the firmware.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- Socket service poll set ---
# The socket service thread (mDNS responder, DNS-SD) polls 4 sockets; with the
# default of 3 it never starts. It peaks just above its 1408-byte default stack.
CONFIG_ZVFS_POLL_MAX=6
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=2400
