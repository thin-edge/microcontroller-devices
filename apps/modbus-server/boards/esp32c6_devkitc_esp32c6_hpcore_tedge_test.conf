#
# Test-only additions for the reconnect test (c8y-direct-core, task 8.3):
# the Wi-Fi and network shells to drop the link on demand, and a "tedge diag"
# command that prints the client state and the mbedTLS heap in use, so a
# leak shows up across cycles. Not for production images.

CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_SHELL=y

# mbedTLS heap accounting for the leak check.
CONFIG_MBEDTLS_MEMORY_DEBUG=y
