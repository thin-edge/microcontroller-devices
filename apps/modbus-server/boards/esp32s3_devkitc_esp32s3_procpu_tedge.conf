# SPDX-License-Identifier: Apache-2.0
#
# The Modbus S3-DevKitC-1 build with thin-edge.io device management. Use on top of the
# board's own configuration:
#   west build --sysbuild -b esp32s3_devkitc/esp32s3/procpu apps/modbus-server \
#     -- -DEXTRA_CONF_FILE="<this file>;<tenant>.conf"
#
# The tenant host belongs in a git-ignored overlay (CONFIG_TEDGE_C8Y_URL).

CONFIG_TEDGE=y
CONFIG_TEDGE_TRANSPORT_C8Y=y
CONFIG_TEDGE_C8Y_MQTT_SERVICE=y
CONFIG_TEDGE_AUTH_C8Y_CA=y
CONFIG_TEDGE_RESTART=y

# --- What the application provides for the client (tedge-zephyr/README.md) ---
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=98304
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y

# The device key lives in PSA ITS, stored through the settings backend.
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y

# --- The TLS heap goes in the board's octal PSRAM ---
# Internal DRAM is too tight for the client next to Modbus otherwise; the S3
# linker script already maps .mbedtls_heap into PSRAM (c8y-direct-spikes,
# section 8 follow-up).
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_TYPE_ESPPSRAM64=y
CONFIG_MBEDTLS_HEAP_CUSTOM_SECTION=y

# One TLS context for MQTT, plus one per remote-access session.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2

# A closed TLS connection holds its TCP context for a moment, so the client
# needs headroom over what Modbus uses.
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_ZVFS_OPEN_MAX=14
