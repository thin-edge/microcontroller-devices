# SPDX-License-Identifier: Apache-2.0
#
# The Modbus C6 build with thin-edge.io device management. Use on top of the
# board's own configuration:
#   west build --sysbuild -b esp32c6_devkitc/esp32c6/hpcore apps/modbus-server \
#     -- -DEXTRA_CONF_FILE="<this file>;<tenant>.conf"
#
# The tenant host belongs in a git-ignored overlay (CONFIG_TEDGE_C8Y_URL).

CONFIG_TEDGE=y
CONFIG_TEDGE_TRANSPORT_C8Y=y
CONFIG_TEDGE_C8Y_MQTT_SERVICE=y
CONFIG_TEDGE_AUTH_C8Y_CA=y
CONFIG_TEDGE_RESTART=y

# --- What the application provides for the client (tedge-zephyr/README.md) ---
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# One TLS session needs 52 KB at the handshake and holds 35 KB; every extra
# concurrent session (a remote-access tunnel, a download) needs another
# ~52 KB while it connects. 96 KB covers MQTT plus one tunnel.
CONFIG_MBEDTLS_HEAP_SIZE=98304
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y

# The device key lives in PSA ITS, stored through the settings backend.
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y

# One TLS context for MQTT, plus one per remote-access session.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2

# A closed TLS connection holds its TCP context for a moment, so the client
# needs headroom over what Modbus uses.
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_ZVFS_OPEN_MAX=14

# --- What a remote-access tunnel needs beside MQTT on a board with no PSRAM
#
# Verified against an interactive htop session over a tunnel (2026-09-20).
# Without these it renders one screen, freezes, and the device drops off the
# cloud and reconnects; the console shows the pool it ran out of. See
# tedge-zephyr/docs/debugging-against-real-devices.md.

# websocket_send_msg() k_mallocs a masking buffer for every frame it sends
# (masking is mandatory client->server), from the same kernel heap the Wi-Fi
# adapter uses. 16 KB covers MQTT alone; a tunnel exhausts it and the
# -ENOMEM surfaces as "sending to the cloud failed".
CONFIG_HEAP_MEM_POOL_SIZE=40960

# The Wi-Fi driver's RX path allocates a net_pkt per frame with a 100 ms
# deadline. At the default 128-byte net_buf a 1500-byte frame costs twelve
# of them, so 64 buffers is about five full-size packets in flight: one
# burst from a repainting terminal empties the pool ("esp32_wifi: Failed to
# allocate net buffer"), frames are dropped, TCP retransmits and the
# tunnel's TLS socket times out. This is burst depth, not bandwidth — the
# same image streams 1 MB happily. Sized for ~16 full packets.
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_BUF_TX_COUNT=64
