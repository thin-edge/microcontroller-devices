#
# Board-agnostic application configuration. Wi-Fi/stack specifics live in
# boards/<board>.conf; secrets in a git-ignored overlay at the repo root.

# --- Firmware identity + simulation selection ---
CONFIG_APP_FIRMWARE_NAME="zephyr-modbus-server"
CONFIG_APP_SIM_PUMP=y

# --- Control ranges/defaults for the pump ---
# speed_setpoint reuses the generic Setpoint control, constrained to 0..100 %.
CONFIG_APP_SETPOINT_MIN=0
CONFIG_APP_SETPOINT_MAX=100
CONFIG_APP_SETPOINT_DEFAULT=0
# Default operating mode = auto (1), so turning Running on spins the pump.
CONFIG_APP_MODE_DEFAULT=1

# --- Modbus ---
CONFIG_MODBUS_ROLE_SERVER=y
CONFIG_MODBUS_NUMOF_RAW_ADU=1

# --- DNS-SD: advertise as a Modbus service on 502 (not OPC-UA) ---
CONFIG_APP_DNSSD_SERVICE_TYPE="_modbus"
CONFIG_APP_DNSSD_PORT=502

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Runtime / memory ---
# main() starts the network, the protocol server and the client, then
# returns; nothing runs on its stack afterwards (the agent measured 1.2 KB
# at 4 KB). Confirm with the thread analyzer (wroom-stackinfo.local.conf)
# when the release workloads change.
CONFIG_MAIN_STACK_SIZE=4096
# The system heap (CONFIG_HEAP_MEM_POOL_SIZE) is not set: on every ESP32
# board the Wi-Fi driver's minimum (51,200 B) wins over any smaller value,
# so the image gets about 55 KB whatever is written here. See the board
# settings files for the size each board resolves to.
# No CONFIG_POSIX_API: the code uses Zephyr's native zsock_* socket API, so
# the POSIX layer's thread, signal, timer and fd pools stay out of the image.

# --- Networking (BSD sockets API; stack specifics per board) ---
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=y
