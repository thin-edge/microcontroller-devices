# --- notifications ------------------------------------------------------------------------
#
# Every trap the firmware sends carries sysUpTime.0 and snmpTrapOID.0; the link traps add
# ifIndex.<n>. The two link points below are varbind points: they match on the trap OID and take
# their value from that ifIndex varbind, which is what lets the event text name the port. All
# three are occurrences, so they use `every = true` — a second identical notification is a
# second event, not a repeat to be suppressed.

[[point]]
id          = "link_down_if"
name        = "Link down"
description = "ifIndex from a linkDown notification"
datatype    = "int32"
address     = { trap = "1.3.6.1.6.3.1.1.5.3", oid = "1.3.6.1.2.1.2.2.1.1" }
meta        = { measurement = false, event = { type = "link_down", text = "Link down on interface {value}", every = true } }

[[point]]
id          = "link_up_if"
name        = "Link up"
description = "ifIndex from a linkUp notification"
datatype    = "int32"
address     = { trap = "1.3.6.1.6.3.1.1.5.4", oid = "1.3.6.1.2.1.2.2.1.1" }
meta        = { measurement = false, event = { type = "link_up", text = "Link up on interface {value}", every = true } }

# A trap point with no `oid` takes the notification itself as its value; typed `bool` it is
# simply `true` on arrival.
[[point]]
id          = "cold_start"
name        = "Cold start"
description = "Sent once after the device first reaches the trap manager"
datatype    = "bool"
address     = { trap = "1.3.6.1.6.3.1.1.5.1" }
meta        = { measurement = false, event = { type = "cold_start", text = "{device} restarted (coldStart)", every = true } }

# --- alternative: alarm on the trap instead of the polled column ---------------------------
#
# Useful when the device is polled slowly (or not at all) and the notification should raise the
# alarm immediately. One alarm for the whole device — the trap OID is the value, so the text
# cannot name the port; pair it with link_down_if above for that. Drop the `meta.alarm` from the
# if<n>_oper_status points if you use this, or every down port raises two alarms.
#
# [[point]]
# id          = "link_state"
# name        = "Link state"
# description = "The last link notification: linkDown (…5.3) or linkUp (…5.4)"
# datatype    = "string"
# address     = { trap = ["1.3.6.1.6.3.1.1.5.3", "1.3.6.1.6.3.1.1.5.4"] }
# meta        = { measurement = false, alarm = { type = "link_down", severity = "major", text = "Link down on {device}", when = { equals = "1.3.6.1.6.3.1.1.5.3" } } }
