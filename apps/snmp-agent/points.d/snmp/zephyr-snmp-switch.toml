# --- ifIndex 4 (GigabitEthernet0/4) --------------------------------------------------------
#
# The port the simulation flaps: sim_switch.c toggles its oper status every
# CONFIG_APP_SIM_SWITCH_FLAP_PERIOD_STEPS sampling steps (15 min as the firmware ships; 0 = never),
# so this is the row that exercises the alarm below and produces the linkUp/linkDown traps.
# At the default that is ~4 notifications a minute, so a device left running is worth building
# with a longer period.

[[point]]
id            = "if4_descr"
name          = "Gi0/4 description"
datatype      = "string"
poll_interval = "1h"
address       = { oid = "1.3.6.1.2.1.2.2.1.2.4" }
meta          = { measurement = false }

[[point]]
id            = "if4_speed"
name          = "Gi0/4 speed"
description   = "Nominal speed; the firmware reports 1 Gbit/s on every port"
datatype      = "uint32"
unit          = "bit/s"
poll_interval = "1h"
address       = { oid = "1.3.6.1.2.1.2.2.1.5.4" }
meta          = { measurement = false }

[[point]]
id          = "if4_admin_status"
name        = "Gi0/4 admin status"
description = "1 = up, 2 = down; the simulation keeps every port administratively up"
datatype    = "int32"
address     = { oid = "1.3.6.1.2.1.2.2.1.7.4" }
meta        = { measurement = false }

[[point]]
id          = "if4_oper_status"
name        = "Gi0/4 operational status"
description = "1 = up, 2 = down"
datatype    = "int32"
address     = { oid = "1.3.6.1.2.1.2.2.1.8.4" }
meta        = { measurement = false, alarm = { type = "if4_link_down", severity = "major", text = "GigabitEthernet0/4 link is down on {device}", when = { equals = 2 } } }

