address  = { oid = "1.3.6.1.2.1.2.2.1.10.4" }

[[point]]
id       = "if4_in_ucast_pkts"
name     = "Gi0/4 in unicast packets"
datatype = "uint32"
unit     = "packets"
address  = { oid = "1.3.6.1.2.1.2.2.1.11.4" }

[[point]]
