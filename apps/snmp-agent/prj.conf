# SPDX-License-Identifier: Apache-2.0
#
# Board-agnostic application configuration. Wi-Fi/stack specifics live in
# boards/<board>.conf; secrets in a git-ignored overlay at the repo root.

# --- Firmware identity + simulation selection ---
CONFIG_APP_DEVICE_NAME="tedge-snmp-device"
CONFIG_APP_FIRMWARE_NAME="zephyr-snmp-agent"
CONFIG_APP_SIM_SWITCH=y
CONFIG_APP_SIM_SWITCH_IF_COUNT=5

# --- SNMP agent + traps (manager address overridden per site) ---
CONFIG_APP_SNMP_AGENT=y
CONFIG_APP_SNMP_PORT=161
CONFIG_APP_SNMP_READ_COMMUNITY="public"
CONFIG_APP_SNMP_TRAP=y
CONFIG_APP_SNMP_TRAP_PORT=162
CONFIG_APP_SNMP_TRAP_COMMUNITY="public"

# --- DNS-SD discovery: advertise as _snmp._udp on 161 (mDNS on hardware boards) ---
CONFIG_APP_DNSSD_SERVICE_TYPE="_snmp"
CONFIG_APP_DNSSD_PORT=161
CONFIG_APP_DNSSD_UDP=y

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Runtime / memory ---
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_POSIX_API=y

# --- Networking (BSD sockets API; SNMP is UDP; stack specifics per board) ---
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_UDP=y
CONFIG_NET_LOG=y
