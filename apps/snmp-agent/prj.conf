#
# Board-agnostic application configuration. Wi-Fi/stack specifics live in
# boards/<board>.conf; secrets in a git-ignored overlay at the repo root.

# --- Firmware identity + simulation selection ---
CONFIG_APP_DEVICE_NAME="tedge-snmp-device"
CONFIG_APP_FIRMWARE_NAME="zephyr-snmp-agent"
CONFIG_APP_SIM_SWITCH=y
CONFIG_APP_SIM_SWITCH_IF_COUNT=5
# One link flap every 15 minutes (900 steps x the 1 s sample interval). The
# Kconfig default of 15 steps makes a short demo lively but a device left
# running noisy: ~4 notifications a minute, each raising or clearing an alarm in
# a collector. Override per build for a livelier demo, or 0 to never flap.
CONFIG_APP_SIM_SWITCH_FLAP_PERIOD_STEPS=900

# --- SNMP agent + traps (manager address overridden per site) ---
CONFIG_APP_SNMP_AGENT=y
CONFIG_APP_SNMP_PORT=161
CONFIG_APP_SNMP_READ_COMMUNITY="public"
CONFIG_APP_SNMP_TRAP=y
CONFIG_APP_SNMP_TRAP_PORT=162
CONFIG_APP_SNMP_TRAP_COMMUNITY="public"

# --- DNS-SD discovery: advertise as _snmp._udp on 161 (mDNS on hardware boards) ---
CONFIG_APP_DNSSD_SERVICE_TYPE="_snmp"
CONFIG_APP_DNSSD_PORT=161
CONFIG_APP_DNSSD_UDP=y

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Runtime / memory ---
# main() starts the network, the protocol server and the client, then
# returns; nothing runs on its stack afterwards (the agent measured 1.2 KB
# at 4 KB). Confirm with the thread analyzer (wroom-stackinfo.local.conf)
# when the release workloads change.
CONFIG_MAIN_STACK_SIZE=4096
# The system heap (CONFIG_HEAP_MEM_POOL_SIZE) is not set: on every ESP32
# board the Wi-Fi driver's minimum (51,200 B) wins over any smaller value,
# so the image gets about 55 KB whatever is written here. See the board
# settings files for the size each board resolves to.
# No CONFIG_POSIX_API: the code uses Zephyr's native zsock_* socket API, so
# the POSIX layer's thread, signal, timer and fd pools stay out of the image.

# --- Networking (BSD sockets API; SNMP is UDP; stack specifics per board) ---
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_UDP=y
CONFIG_NET_LOG=y
