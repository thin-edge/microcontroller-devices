# SPDX-License-Identifier: Apache-2.0
#
# The SNMP ESP32-CAM build with thin-edge.io device management. Use on top
# of the board's own configuration:
#   west build --sysbuild -b esp32_devkitc/esp32/procpu apps/snmp-agent \
#     -- -DEXTRA_CONF_FILE="<board>.conf;<this file>;<tenant>.conf"
#
# The tenant host belongs in a git-ignored overlay (CONFIG_TEDGE_C8Y_URL).
#
# The SNMP agent alone is UDP-only; the client needs TCP for MQTT/TLS, the
# HTTP transfers and the remote-access WebSocket, so this file turns it back
# on and sizes the pools for it.

CONFIG_TEDGE=y
CONFIG_TEDGE_TRANSPORT_C8Y=y
CONFIG_TEDGE_C8Y_MQTT_SERVICE=y
CONFIG_TEDGE_AUTH_C8Y_CA=y
CONFIG_TEDGE_RESTART=y

# --- TCP, which the SNMP-only build switches off ---
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

# --- What the application provides for the client (tedge-zephyr/README.md) ---
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=98304
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y

# The device key lives in PSA ITS, stored through the settings backend.
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y

# --- The TLS heap goes in the module's quad PSRAM ---
# A classic ESP32 has only a 192 KB DRAM segment, so the 96 KB mbedTLS heap
# cannot live in it beside the client and the agent. The ESP32-CAM module
# carries 4 MB of quad PSRAM; without this the image does not fit at all.
#
# SPIRAM_TYPE_* alone leaves CONFIG_ESP_SPIRAM_SIZE at 0, the ext_dram
# region is empty and the link fails with "External SPIRAM overflowed", so
# the size has to be stated.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_QUAD=y
CONFIG_SPIRAM_TYPE_ESPPSRAM32=y
CONFIG_ESP_SPIRAM_SIZE=4194304
CONFIG_MBEDTLS_HEAP_CUSTOM_SECTION=y

# --- What this part can carry ---
# A classic ESP32 splits its RAM into dram0 (192 KB) and dram1 (96 KB), and
# the net_buf pools and .dram0.noinit all land in dram1. With every feature
# enabled it overflows by 33 KB, so this board gets a deliberately small
# set: know the device is there, see how it is doing, restart it, and
# **update its firmware** — the one that matters, because without it the
# board can only ever be changed with a cable.
#
# Firmware update needs a second concurrent TLS session for the HTTPS
# download, so it is what the TLS context budget is spent on. Everything
# else that would want one is off:
CONFIG_TEDGE_FIRMWARE_UPDATE=y
CONFIG_TEDGE_FIRMWARE_STACK_SIZE=8192
CONFIG_TEDGE_TELEMETRY=y
CONFIG_TEDGE_HEALTH=y

# Off, and why: each needs RAM this part does not have, and the first three
# need a TLS session of their own beside MQTT and the download.
CONFIG_TEDGE_REMOTE_ACCESS=n
CONFIG_TEDGE_LOG_UPLOAD=n
CONFIG_TEDGE_CERT_RENEWAL=n
CONFIG_TEDGE_SHELL_COMMAND=n
CONFIG_TEDGE_COREDUMP=n
CONFIG_TEDGE_PARAMETERS=n

# MQTT plus one HTTPS download.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2

# --- Network buffers, as deep as this part allows ---
# A classic ESP32 splits its RAM into dram0 (192 KB) and dram1 (96 KB), and
# the net_buf pools and the kernel heap all land in dram1. The sizing the C6
# and the S3 boards use (96/64 buffers, 40 KB heap) fills it to 99.4% —
# 608 bytes spare — so this board takes the step below.
#
# With remote access off there is no tunnel to buffer for, so these stay
# near stock — 256-byte net_bufs rather than 128 is the one change worth
# keeping, because it quarters the number of allocations per frame. See
# tedge-zephyr/docs/debugging-against-real-devices.md.
# 16 KB is what the SNMP-only build used. The bigger heap the other
# boards need is for websocket masking buffers, and there is no tunnel
# here. Going back to it leaves this image a few KB of dram1 to spare
# rather than the 48 bytes it had at 20 KB.
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=20

CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_ZVFS_OPEN_MAX=14
