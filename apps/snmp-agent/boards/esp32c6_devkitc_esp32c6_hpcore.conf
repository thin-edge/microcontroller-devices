# SPDX-License-Identifier: Apache-2.0
#
# ESP32-C6 (QIQIAZI board carrying an ESP32-C6-WROOM-1-N4 module; single-core
# **RISC-V** + LP core, 160 MHz, ~512 KB HP SRAM, 4 MB flash, no PSRAM).
# Build target: esp32c6_devkitc/esp32c6/hpcore.
#
# *** This is the first RISC-V target in this repo, and the first Wi-Fi 6
# radio. *** Everything below is architecture-neutral and copied from the
# verified Xtensa ESP32-S3 ports: the net-buffer and stack figures were measured
# from workload behaviour (mDNS socket count, workqueue and log stack peaks
# under the protocol threads), not from SoC specifics, so they carry over. If a
# genuinely RISC-V-specific setting is ever needed, add it here under its own
# heading so the architecture split stays easy to find.
#
# The board is a clone, not an Espressif C6-DevKitC-1, so nothing here depends
# on board pinout — only on the on-die Wi-Fi and USB-Serial-JTAG peripherals.
#
# Two notes carried from the S3-DevKitC port:
#   * No &wifi overlay. The C6 board devicetree already sets the Wi-Fi node to
#     "okay", so CONFIG_WIFI_ESP32 can be selected directly.
#   * The sibling .overlay re-routes the console onto USB-Serial-JTAG and
#     corrects the declared flash size from the dtsi's 8 MB to the real 4 MB.
#
# No status LED: the board has a WS2812 addressable RGB LED, not the plain GPIO
# led0 alias lib/common/status_led.c drives, and the clone's LED pin is not
# documented upstream. The indicator is a no-op here (the "No LED present"
# scenario in the wifi-connectivity spec); read connectivity from the console.
#
# The C6 also carries IEEE 802.15.4 and BT LE radios, enabled in the board
# devicetree. Neither is used: no CONFIG_BT or CONFIG_IEEE802154 is set, so no
# driver is built and neither costs flash. This firmware is a Wi-Fi station.

# --- Wi-Fi driver ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_APP_WIFI=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y

# The system heap is not set: the Wi-Fi driver's minimum (51,200 B) wins
# over any smaller CONFIG_HEAP_MEM_POOL_SIZE, so this board's images get
# about 55 KB of system heap whatever is written here (the exact sum of the
# drivers' minimums varies a little with the options built).

# --- IP stack (UDP only; SNMP + DHCP + mDNS are all UDP) ---
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_DHCPV4=y

# --- mDNS + DNS-SD: resolve <hostname>.local and advertise _snmp._udp (port in prj.conf) ---
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="tedge-snmp"
CONFIG_NET_HOSTNAME_UNIQUE=y
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
# Resolve the trap-manager hostname (incl. mDNS ".local") at runtime.
CONFIG_DNS_RESOLVER=y
CONFIG_MDNS_RESOLVER=y

# --- Socket / net buffer budget (a couple of UDP sockets: agent + trap) ---
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=6
CONFIG_ZVFS_OPEN_MAX=12
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
# The RX pool bottomed out at 4 free of 24 over a 10 h soak (0 free in an
# earlier one), the tightest resource on these builds. 32 keeps a margin; the
# OPC-UA firmware, which carries more traffic, uses 40.
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=24

# --- Thread stacks (measured with the thread analyzer on an ESP32-CAM) ---
# The system workqueue peaks at ~770 B of its 1 KB default and the log thread
# at ~900 B of 1 KB; an overflow of either silently corrupts memory and stalls
# the firmware. Give both headroom. (The connectivity work that overflowed the
# system workqueue now runs on its own queue: CONFIG_APP_NET_WORKQ_STACK_SIZE.)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# --- Socket service poll set ---
# The socket service thread (mDNS responder, DNS-SD) polls 4 sockets here. With
# the default of 3 it logs "Please increase CONFIG_ZVFS_POLL_MAX" and never
# starts, so the device stops answering mDNS.
CONFIG_ZVFS_POLL_MAX=6
# Once it runs, the service thread (mDNS responder) peaks at ~1.4 KB: 16 bytes
# short of its 1408-byte default. Give it headroom.
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=2400
