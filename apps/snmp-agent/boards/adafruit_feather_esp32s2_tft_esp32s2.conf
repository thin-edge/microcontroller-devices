# SPDX-License-Identifier: Apache-2.0
#
# Adafruit Feather ESP32-S2 TFT for the SNMP agent: single-core Xtensa LX7 Wi-Fi
# with 2 MB PSRAM and a built-in TFT. Build target:
# adafruit_feather_esp32s2_tft/esp32s2.
#
# NOTE: the S2 Feather cannot currently pass Wi-Fi traffic under this Zephyr
# (see the project's ESP32-S2 Wi-Fi note); this config is provided for parity
# and offline/bench use — verify end-to-end SNMP on the ESP32-WROOM instead.

# --- Wi-Fi driver ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_APP_WIFI=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y

CONFIG_HEAP_MEM_POOL_SIZE=16384

# --- IP stack (UDP only) ---
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_DHCPV4=y

# --- mDNS + DNS-SD: resolve <hostname>.local and advertise _snmp._udp (port in prj.conf) ---
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="tedge-snmp"
CONFIG_NET_HOSTNAME_UNIQUE=y
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
# Resolve the trap-manager hostname (incl. mDNS ".local") at runtime.
CONFIG_DNS_RESOLVER=y
CONFIG_MDNS_RESOLVER=y

# --- Built-in TFT status display (ST7789 over MIPI-DBI SPI) ---
CONFIG_APP_DISPLAY_STATUS=y
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_ST7789V=y
CONFIG_ST7789V_RGB565=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_POWER_DOMAIN=y

# --- Socket / net buffer budget ---
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=6
CONFIG_ZVFS_OPEN_MAX=12
CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_PKT_TX_COUNT=6
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
