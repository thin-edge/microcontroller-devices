# SPDX-License-Identifier: Apache-2.0
#
# native_sim networking via NSOS (Native Simulator Offloaded Sockets): Zephyr
# BSD socket calls route straight to the host OS. Because SNMP is UDP (no
# accept()/select() on a listening TCP socket), the agent can be exercised
# end-to-end on native_sim with host tools (snmpget/snmpwalk/snmptrapd) — unlike
# the TCP-based OPC-UA/Modbus firmwares.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_IPV6_DAD=n
