# SPDX-License-Identifier: Apache-2.0
#
# ESP32-WROOM-32 for the SNMP agent. Wi-Fi station + native IP stack + mDNS. The
# SNMP agent is UDP-only and small, so net pools are modest and TCP is left off.

# Allow older ESP32 silicon (WROOM-32 rev v1.0) to boot.
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

# --- Wi-Fi driver ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_APP_WIFI=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y

CONFIG_HEAP_MEM_POOL_SIZE=16384

# --- IP stack (UDP only; SNMP + DHCP + mDNS are all UDP) ---
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_DHCPV4=y

# --- mDNS + DNS-SD: resolve <hostname>.local and advertise _snmp._udp (port in prj.conf) ---
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="tedge-snmp"
CONFIG_NET_HOSTNAME_UNIQUE=y
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
# Resolve the trap-manager hostname (incl. mDNS ".local") at runtime.
CONFIG_DNS_RESOLVER=y
CONFIG_MDNS_RESOLVER=y

# --- Socket / net buffer budget (a couple of UDP sockets: agent + trap) ---
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=6
CONFIG_ZVFS_OPEN_MAX=12
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=24
