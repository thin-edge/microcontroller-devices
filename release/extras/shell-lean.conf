#
# The cloud shell command (c8y_Command) for boards without room for the full
# shell-diagnostics extra: goes after
# {tiny-edge}/ports/zephyr/profiles/extras/shell-diagnostics.conf in a build's
# extra_conf (release/devices.yml), and trims it. Measured on the
# ESP32-C6 Modbus tedge-full image in DEVICES.md.
#
# A cloud command runs on the client's command thread against the dummy
# backend, and its result is cut at about 220 bytes. So the shell needs no
# history, completion, terminal handling or log backend, and its own thread
# only starts the backend.
CONFIG_SHELL_STACK_SIZE=1536
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_TAB=n
CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_METAKEYS=n
CONFIG_SHELL_STATS=n
CONFIG_SHELL_CMDS=n
CONFIG_SHELL_CMD_BUFF_SIZE=160
CONFIG_SHELL_ARGC_MAX=12
CONFIG_DEVICE_SHELL=n
CONFIG_LOG_CMDS=n
CONFIG_LOG_RUNTIME_FILTERING=n
# Only "kernel uptime", "kernel version" and "kernel heap" are allowed, not
# the thread commands that stack painting serves.
CONFIG_INIT_STACKS=n
# What a command printed is cut to one result of about 220 bytes, so
# capturing more only fills the result queue (two entries).
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=256
CONFIG_TEDGE_SHELL_COMMAND_OUTPUT_BYTES=256

# `tedge net` (lib/common/net.c) answers in one short result instead of the
# network and Wi-Fi shells (`net iface`, `wifi status`), which print more
# than a result holds and cost about 65 KB of flash.
CONFIG_NET_SHELL=n
CONFIG_NET_L2_WIFI_SHELL=n
CONFIG_APP_NET_SHELL_CMD=y

#   kernel uptime / kernel version   how long it has run, what it runs
#   kernel heap                      the kernel heap (Wi-Fi driver, tunnel)
#   tedge net                        Wi-Fi, address, gateway, DNS
#   tedge params list / tedge diag   the client's parameter sets and state
#   tedge identify [seconds]         blink the status LED to find the board
CONFIG_TEDGE_SHELL_COMMAND_ALLOW_LIST="kernel uptime,kernel version,kernel heap,tedge net,tedge params list,tedge diag,tedge identify"
