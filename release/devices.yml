# SPDX-License-Identifier: Apache-2.0
#
# The devices a release ships images for, and which (app, variant) builds
# each one gets. The release workflow's build matrix, the release notes and
# the README's supported-devices table all come from this file; a build that
# is not listed here is not released. scripts/release/matrix.py validates it.
#
# OPC-UA runs out of memory beside the client on every board but the QT Py
# (DEVICES.md), so it ships standalone elsewhere.
#
# A full or ota build is listed only once it has been built *and run* on the
# board (connection, telemetry, a firmware update that confirms, a tunnel if
# remote access is in, a protocol read alongside): `measured` points at the
# DEVICES.md entry that records it.
#
# `pr: true` marks the builds a pull request builds (a release builds all of
# them): every device, app, variant and extra, with each board's tightest
# images. Every device needs at least one.
#
# Adding a device: its board needs a provisioner layout
# (sysbuild/provisioning.cmake) and board files for each app it builds.

# Every image is named <app>-<os>-<set>-<device>: the release files, the
# firmware name the image reports, and its firmware entry in Cumulocity. A
# variant is named <os>-<set>: <os> follows from its framework (zephyr, idf
# for esp-idf, nuttx), and <set> is its `set`: standalone (the protocol
# server alone), full (every thin-edge.io feature) or ota (connection,
# telemetry, restart and firmware update, plus what else fits). A name is at
# most 47 characters.
#
# How each variant is built. `profile` and the device's `tedge_board_conf` go
# into EXTRA_CONF_FILE (profile first, so the board's sizes win), then the
# build's `extra_conf`. `provisioner` selects the Wi-Fi provisioner image.
# Paths are relative to this repository, or "{tiny-edge}/..." for files from
# the tiny-edge west project (the client's profiles and board sizing).
#
# `framework: esp-idf` marks an ESP-IDF application (apps/<app> built with
# idf.py, the device's `chip` as the target): no Zephyr profile, board files
# or tiny-edge board configuration; it brings its own sdkconfig.defaults.
#
# `framework: nuttx` marks tiny-edge's NuttX agent, built with tiny-edge's
# ports/nuttx/scripts/build.sh for the device's `nuttx_board` (a board
# tiny-edge's NuttX port has a configuration for). The build's `extra_conf`
# are NuttX configuration fragments, such as
# "{tiny-edge}/ports/nuttx/configs/esp32s3-psram-octal.conf".
variants:
  zephyr-standalone:
    description: the protocol server alone; Wi-Fi over Improv BLE
    set: standalone
    provisioner: improv
  zephyr-full:
    description: every thin-edge.io feature; Wi-Fi and Cumulocity over lab-ztp-provisioner
    set: full
    profile: "{tiny-edge}/ports/zephyr/profiles/full.conf"
    provisioner: ztp
  zephyr-ota:
    description: connection, telemetry, restart and firmware update, plus what else fits; Wi-Fi and Cumulocity over lab-ztp-provisioner
    set: ota
    profile: "{tiny-edge}/ports/zephyr/profiles/ota.conf"
    provisioner: ztp
  idf-full:
    description: the device agent on ESP-IDF (FreeRTOS) with every thin-edge.io feature; Wi-Fi and Cumulocity over USB with tedge-onboard
    framework: esp-idf
    set: full
    provisioner: tedge-onboard
  nuttx-full:
    description: the device agent on NuttX with every thin-edge.io feature; Wi-Fi and Cumulocity over USB with tedge-onboard
    framework: nuttx
    set: full
    provisioner: tedge-onboard

# An app's name in the image names, where it differs from its directory
# under apps/.
apps:
  tedge-agent-idf:
    name: tedge-agent

provisioners:
  improv: null
  ztp: apps/wifi-provisioner/overlay-ztp.conf
  # tiny-edge's tools/onboard, run on the computer the board is plugged into.
  tedge-onboard: null

devices:
  - id: esp32c6-devkitc
    name: ESP32-C6-DevKitC-1 (N4)
    board: esp32c6_devkitc/esp32c6/hpcore
    chip: esp32c6
    flash_size: 4MB
    esptool_before: usb-reset
    tedge_board_conf: "{tiny-edge}/ports/zephyr/profiles/boards/esp32c6-devkitc.conf"
    nuttx_board: esp32c6-devkitc
    builds:
      - { app: modbus-server, variant: zephyr-standalone, pr: true }
      - { app: opcua-server, variant: zephyr-standalone }
      - { app: snmp-agent, variant: zephyr-standalone }
      - app: modbus-server
        variant: zephyr-full
        pr: true
        extra_conf:
          - "{tiny-edge}/ports/zephyr/profiles/extras/shell-diagnostics.conf"
          - release/extras/shell-lean.conf
        measured: DEVICES.md#lean-cloud-shell-on-the-esp32-c6-2026-11-11
      - app: modbus-server
        variant: zephyr-ota
        measured: DEVICES.md#release-builds-measured-on-the-boards-2026-09-21
      - app: snmp-agent
        variant: zephyr-full
        pr: true
        measured: DEVICES.md#release-builds-measured-on-the-boards-2026-09-21
      - app: snmp-agent
        variant: zephyr-ota
        measured: DEVICES.md#release-builds-measured-on-the-boards-2026-09-21
      - app: tedge-agent
        variant: zephyr-full
        measured: DEVICES.md#release-builds-measured-on-the-boards-2026-09-21
      - app: tedge-agent
        variant: zephyr-ota
        pr: true
        measured: DEVICES.md#release-builds-measured-on-the-boards-2026-09-21
      - app: tedge-agent-idf
        variant: idf-full
        pr: true
        measured: DEVICES.md#esp-idf-agent-on-the-esp32-c6-2026-11-12
      - app: tedge-agent
        variant: nuttx-full
        pr: true
        measured: DEVICES.md#nuttx-agent-on-the-esp32-c6-2026-11-17

  - id: esp32s3-devkitc
    name: ESP32-S3-DevKitC-1 (N16R8)
    board: esp32s3_devkitc/esp32s3/procpu
    chip: esp32s3
    flash_size: 16MB
    esptool_before: default-reset
    tedge_board_conf: "{tiny-edge}/ports/zephyr/profiles/boards/esp32s3-devkitc.conf"
    nuttx_board: esp32s3-devkit
    builds:
      - { app: modbus-server, variant: zephyr-standalone }
      - { app: opcua-server, variant: zephyr-standalone, pr: true }
      - { app: snmp-agent, variant: zephyr-standalone }
      - app: modbus-server
        variant: zephyr-full
        pr: true
        extra_conf: ["{tiny-edge}/ports/zephyr/profiles/extras/shell-diagnostics.conf"]
        measured: DEVICES.md#shell-diagnostics-measured-2026-09-22
      - app: modbus-server
        variant: zephyr-ota
        measured: DEVICES.md#release-builds-measured-on-the-boards-2026-09-21
      - app: snmp-agent
        variant: zephyr-full
        pr: true
        measured: DEVICES.md#release-builds-measured-on-the-boards-2026-09-21
      - app: snmp-agent
        variant: zephyr-ota
        measured: DEVICES.md#release-builds-measured-on-the-boards-2026-09-21
      - app: tedge-agent
        variant: zephyr-full
        extra_conf: ["{tiny-edge}/ports/zephyr/profiles/extras/shell-diagnostics.conf"]
        measured: DEVICES.md#shell-diagnostics-measured-2026-09-22
      - app: tedge-agent
        variant: zephyr-ota
        measured: DEVICES.md#release-builds-measured-on-the-boards-2026-09-21
      # Every feature needs the module's 8 MB of octal PSRAM for the mbedTLS
      # heap; the image does not start on a module without PSRAM.
      - app: tedge-agent
        variant: nuttx-full
        pr: true
        extra_conf: ["{tiny-edge}/ports/nuttx/configs/esp32s3-psram-octal.conf"]
        measured: DEVICES.md#nuttx-agent-on-the-esp32-s3-2026-11-17

  - id: qtpy-esp32s3
    name: Adafruit QT Py ESP32-S3 (N4R2)
    board: adafruit_qt_py_esp32s3/esp32s3/procpu
    chip: esp32s3
    flash_size: 4MB
    esptool_before: usb-reset
    tedge_board_conf: "{tiny-edge}/ports/zephyr/profiles/boards/qtpy-esp32s3.conf"
    builds:
      - { app: modbus-server, variant: zephyr-standalone }
      - { app: opcua-server, variant: zephyr-standalone }
      - { app: snmp-agent, variant: zephyr-standalone, pr: true }
      - app: modbus-server
        variant: zephyr-full
        extra_conf: ["{tiny-edge}/ports/zephyr/profiles/extras/shell-diagnostics.conf"]
        measured: DEVICES.md#shell-diagnostics-measured-2026-09-22
      - app: modbus-server
        variant: zephyr-ota
        measured: DEVICES.md#release-builds-measured-on-the-boards-2026-09-21
      - app: opcua-server
        variant: zephyr-ota
        pr: true
        measured: DEVICES.md#release-builds-measured-on-the-boards-2026-09-21
      - app: snmp-agent
        variant: zephyr-full
        measured: DEVICES.md#release-builds-measured-on-the-boards-2026-09-21
      - app: snmp-agent
        variant: zephyr-ota
        measured: DEVICES.md#release-builds-measured-on-the-boards-2026-09-21
      - app: tedge-agent
        variant: zephyr-full
        pr: true
        extra_conf: ["{tiny-edge}/ports/zephyr/profiles/extras/shell-diagnostics.conf"]
        measured: DEVICES.md#shell-diagnostics-measured-2026-09-22
      - app: tedge-agent
        variant: zephyr-ota
        measured: DEVICES.md#release-builds-measured-on-the-boards-2026-09-21

  - id: esp32-devkitc
    name: ESP32-WROOM-32 DevKitC
    board: esp32_devkitc/esp32/procpu
    chip: esp32
    flash_size: 4MB
    esptool_before: default-reset
    tedge_board_conf: "{tiny-edge}/ports/zephyr/profiles/boards/esp32-devkitc.conf"
    builds:
      - { app: modbus-server, variant: zephyr-standalone }
      - { app: opcua-server, variant: zephyr-standalone, pr: true }
      - { app: snmp-agent, variant: zephyr-standalone }
      # One feature set for every tedge build on this board: ota (which
      # includes certificate renewal) and parameters. No remote access: its
      # 32 x 128 B receive buffers hold about three Wi-Fi frames, and an
      # interactive session (htop) fails (DEVICES.md). No log upload: its 8 KB stack does not
      # fit beside the mbedTLS heap here.
      - app: modbus-server
        variant: zephyr-ota
        pr: true
        extra_conf:
          - "{tiny-edge}/ports/zephyr/profiles/extras/parameters.conf"
        measured: DEVICES.md#wroom-and-esp32-cam-release-builds-measured-2026-09-23
      - app: tedge-agent
        variant: zephyr-ota
        pr: true
        extra_conf:
          - "{tiny-edge}/ports/zephyr/profiles/extras/parameters.conf"
        measured: DEVICES.md#wroom-and-esp32-cam-release-builds-measured-2026-09-23

  - id: esp32-cam
    name: ESP32-CAM (ESP32 + 4 MB PSRAM)
    board: esp32_devkitc/esp32/procpu
    chip: esp32
    flash_size: 4MB
    esptool_before: default-reset
    tedge_board_conf: "{tiny-edge}/ports/zephyr/profiles/boards/esp32-cam.conf"
    dtc_overlays: [lib/common/dts/esp32cam-status-led.overlay]
    # One feature set for every tedge build on this board: ota (which
    # includes certificate renewal), parameters and log upload. dram1 (stacks, network buffers)
    # is what limits it; the mbedTLS heap is in PSRAM and the client's heap
    # in dram0. No remote access: the receive buffers it has room for are
    # too shallow for an interactive tunnel, as on the WROOM (DEVICES.md).
    builds:
      - app: snmp-agent
        variant: zephyr-ota
        pr: true
        extra_conf: &cam-extras
          - "{tiny-edge}/ports/zephyr/profiles/extras/parameters.conf"
          - "{tiny-edge}/ports/zephyr/profiles/extras/log-upload.conf"
        measured: DEVICES.md#wroom-and-esp32-cam-release-builds-measured-2026-09-23
      - app: modbus-server
        variant: zephyr-ota
        extra_conf: *cam-extras
        measured: DEVICES.md#wroom-and-esp32-cam-release-builds-measured-2026-09-23
      - app: tedge-agent
        variant: zephyr-ota
        extra_conf: *cam-extras
        measured: DEVICES.md#wroom-and-esp32-cam-release-builds-measured-2026-09-23
