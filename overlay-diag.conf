#
# Diagnostic overlay for stall investigations (not for deployed builds).
# Add it with -DEXTRA_CONF_FILE="overlay-wifi-credentials.conf;overlay-diag.conf"
# and read the output as described in the README's troubleshooting section.

# Periodic HEALTH line, STALE reports and thread dumps (lib/common/diag.c).
CONFIG_APP_DIAG=y
CONFIG_APP_DIAG_PERIOD_S=10

# Write every log message out as it is logged, so what was printed just before
# a stall reaches the console even if the log thread never runs again.
CONFIG_LOG_MODE_IMMEDIATE=y

# Immediate logging formats every message on the caller's stack, so the
# threads that log need more room than in a release build.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_APP_NET_WORKQ_STACK_SIZE=4096

# Free-count sources for the HEALTH line.
CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Per-thread stack headroom in thread dumps, plus the thread analyzer for an
# on-demand report.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y

# Backtraces on a fatal exception: on ESP32 (Xtensa) that is
# CONFIG_XTENSA_ENABLE_BACKTRACE, already on by default. The generic
# CONFIG_EXCEPTION_STACK_TRACE needs ARCH_STACKWALK, which Xtensa lacks.
