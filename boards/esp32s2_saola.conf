#
# ESP32-S2 (co-primary target; representative board for the Feather ESP32-S2
# TFT). Single-core Wi-Fi with 2 MB PSRAM used to give the OPC-UA stack heap
# headroom. If your exact board differs, copy this to boards/<your-board>.conf.

# --- Wi-Fi driver ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_APP_WIFI=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y

# --- External PSRAM (2 MB) — the practical memory enabler on this part ---
CONFIG_ESP_SPIRAM=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=262144
# Route the system heap into PSRAM so open62541's dynamic allocations have room.
CONFIG_HEAP_MEM_POOL_SIZE=262144

# --- IP stack ---
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y

# --- mDNS / DNS-SD advertisement ---
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="tedge-opcua"
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y

CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=8
CONFIG_ZVFS_OPEN_MAX=16
