#
# Adafruit Feather ESP32-S2 TFT (co-primary target): single-core Xtensa LX7
# Wi-Fi with 2 MB PSRAM. Build target: adafruit_feather_esp32s2_tft/esp32s2.

# --- Wi-Fi driver ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_APP_WIFI=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y

# open62541 uses the libc malloc arena (sized "all remaining RAM"); keep the
# separate k_heap small so it does not steal from that arena. The S2's 320 KB
# internal SRAM is ample for the tuned open62541 build, so PSRAM is not required
# here. (Enabling CONFIG_ESP_SPIRAM needs extra linker-region config; left off.)
CONFIG_HEAP_MEM_POOL_SIZE=16384

# --- IP stack ---
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y

# --- mDNS / DNS-SD advertisement ---
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="tedge-opcua"
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y

# --- Built-in TFT status display (ST7789 over MIPI-DBI SPI) ---
CONFIG_APP_DISPLAY_STATUS=y
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_ST7789V=y
CONFIG_ST7789V_RGB565=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_POWER_DOMAIN=y

# Socket / net buffer budget.
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=6
CONFIG_ZVFS_OPEN_MAX=12
CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_PKT_TX_COUNT=6
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
