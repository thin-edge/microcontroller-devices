#
# Raspberry Pi Pico W (RP2040 + CYW43 Wi-Fi) — additional/stretch target.
# Build for the Pico W target (e.g. `-b rpi_pico/rp2040/w` or `rpi_pico_w`,
# depending on your Zephyr version). RP2040 has only ~264 KB SRAM shared with
# the Wi-Fi stack, so this is the tightest target and may be descoped if
# open62541 does not fit. Zephyr's CYW43 Wi-Fi support is less mature than
# ESP32's — bring up a raw TCP socket before layering OPC-UA on top.

# --- Wi-Fi driver (CYW43 via Infineon HAL) ---
CONFIG_WIFI=y
CONFIG_APP_WIFI=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y

# --- IP stack ---
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y

# --- mDNS / DNS-SD advertisement ---
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="tedge-opcua"
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y

# Keep memory usage tight on RP2040.
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=4
CONFIG_ZVFS_OPEN_MAX=12
