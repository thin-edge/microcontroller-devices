#
# native_sim networking via NSOS (Native Simulator Offloaded Sockets): Zephyr
# BSD socket calls are routed straight to the host OS. A real OPC-UA client on
# the host/container can then connect to the server's port without setting up a
# zeth TAP interface (no root/CAP_NET_ADMIN needed) — ideal for automated tests.
#
# Note: the Zephyr-native IP stack, DHCP and mDNS responder are bypassed in this
# mode, so those features are validated on hardware, not here.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_IPV6_DAD=n

# open62541 allocates via libc malloc; the default 16 KB arena is far too small
# for the OPC-UA stack. The host has ample RAM, so give native_sim a large arena.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=4194304
