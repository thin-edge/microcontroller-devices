# SPDX-License-Identifier: Apache-2.0
#
# ESP32-WROOM-32 (co-primary target): Wi-Fi station + native IP stack + mDNS.

# Allow running on older ESP32 silicon (e.g. WROOM-32 chip revision v1.0),
# which the v4.4 bootloader otherwise refuses to boot.
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

# --- Wi-Fi driver ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_APP_WIFI=y

# open62541 allocates via libc malloc, whose arena is "all remaining RAM"
# (CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1). Keep the separate k_heap small so
# it does not steal RAM from that arena; the net/Wi-Fi stacks use net_buf pools
# and the Espressif blob's own heap, not this k_heap.
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y

# --- IP stack ---
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y

# --- mDNS / DNS-SD advertisement ---
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="tedge-opcua"
CONFIG_NET_HOSTNAME_UNIQUE=y
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y

# Socket / connection headroom for the OPC-UA server.
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=6
CONFIG_ZVFS_OPEN_MAX=12

# --- RAM budget tuning (WROOM-32 has no PSRAM) ---
# The Wi-Fi stack and open62541 share ~300 KB of SRAM. Trim net buffer pools to
# leave more heap for the OPC-UA server.
CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_PKT_TX_COUNT=6
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16

# Wi-Fi robustness on mesh networks: auto-reconnect on drop, and scan all APs
# to pick the strongest (not just the first found — important with multiple
# mesh nodes sharing one SSID).
CONFIG_ESP32_WIFI_STA_RECONNECT=y
CONFIG_ESP32_WIFI_STA_SCAN_ALL=y
