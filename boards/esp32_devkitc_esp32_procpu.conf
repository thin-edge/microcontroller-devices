# SPDX-License-Identifier: Apache-2.0
#
# ESP32-WROOM-32 (co-primary target): Wi-Fi station + native IP stack + mDNS.

# Allow running on older ESP32 silicon (e.g. WROOM-32 chip revision v1.0),
# which the v4.4 bootloader otherwise refuses to boot.
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

# --- Wi-Fi driver ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_APP_WIFI=y

# open62541 allocates via libc malloc, whose arena is "all remaining RAM"
# (CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1). Keep the separate k_heap small so
# it does not steal RAM from that arena; the net/Wi-Fi stacks use net_buf pools
# and the Espressif blob's own heap, not this k_heap.
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y

# --- IP stack ---
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y

# --- mDNS / DNS-SD advertisement ---
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="tedge-opcua"
CONFIG_NET_HOSTNAME_UNIQUE=y
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y

# Socket / connection headroom for the OPC-UA server. Sized with margin so a
# burst of client (re)connections does not exhaust contexts/file descriptors —
# which would make the event loop's select() fail with ENOMEM and wedge the
# whole network stack (see the connection-churn stress test).
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_MAX_CONN=10
CONFIG_ZVFS_OPEN_MAX=16

# Free closed TCP connections quickly (default 1500 ms). A collector that
# reconnects frequently otherwise leaves many contexts pinned in TIME_WAIT.
CONFIG_NET_TCP_TIME_WAIT_DELAY=250

# --- RAM budget tuning (WROOM-32 has no PSRAM) ---
# The Wi-Fi stack and open62541 share ~300 KB of SRAM. These pools must be deep
# enough that a burst of client (re)connections does not starve the Wi-Fi driver
# of RX net buffers ("esp32_wifi: Failed to allocate net buffer"), which would
# otherwise wedge the network path. Sized with margin (verified via the
# connection-churn stress test) while still leaving heap for open62541.
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=40
CONFIG_NET_BUF_TX_COUNT=32
