#
# MCUboot additions for the Wi-Fi provisioner (applied by
# sysbuild/provisioning.cmake): the hooks in prov_hooks.c.
CONFIG_BOOT_GO_HOOKS=y
CONFIG_BOOT_FLASH_AREA_HOOKS=y
# mcuboot_status_change(): a console line when no application is bootable.
CONFIG_MCUBOOT_ACTION_HOOKS=y
# Check the application's signature on every boot, not only after an update:
# an unsigned or corrupted image in slot0 is refused. (The provisioner is always
# checked, by the hook.)
CONFIG_BOOT_VALIDATE_SLOT0=y
