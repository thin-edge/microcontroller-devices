# SPDX-License-Identifier: Apache-2.0
#
# ESP32-CAM (ESP32 + 4 MB quad PSRAM) settings for any application built with
# tedge-zephyr. Put after the profile in EXTRA_CONF_FILE, and build with
# -DEXTRA_DTC_OVERLAY_FILE=lib/common/dts/esp32cam-status-led.overlay.
# The board target is the WROOM's (esp32_devkitc/esp32/procpu); this file is
# what differs.

# --- TCP, which the SNMP-only build switches off ---
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

CONFIG_MBEDTLS_HEAP_SIZE=98304
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384

# --- The TLS heap goes in the module's quad PSRAM ---
# A classic ESP32 has only a 192 KB DRAM segment, so the 96 KB mbedTLS heap
# cannot live in it beside the client and the application. The ESP32-CAM
# module carries 4 MB of quad PSRAM; without this the image does not fit.
#
# SPIRAM_TYPE_* alone leaves CONFIG_ESP_SPIRAM_SIZE at 0, the ext_dram
# region is empty and the link fails with "External SPIRAM overflowed", so
# the size has to be stated.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_QUAD=y
CONFIG_SPIRAM_TYPE_ESPPSRAM32=y
CONFIG_ESP_SPIRAM_SIZE=4194304
CONFIG_MBEDTLS_HEAP_CUSTOM_SECTION=y

# MQTT plus one HTTPS download.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2

# --- Network buffers, as deep as this part allows ---
# A classic ESP32 splits its RAM into dram0 (192 KB) and dram1 (96 KB), and
# the net_buf pools and the kernel heap all land in dram1. The sizing the C6
# and the S3 boards use (96/64 buffers, 40 KB heap) fills it to 99.4% —
# 608 bytes spare — so this board takes the step below. With every
# tedge-zephyr feature enabled dram1 overflows by 33 KB, which is why this
# board ships the ota profile (DEVICES.md).
#
# 256-byte net_bufs rather than 128 quarter the number of allocations per
# frame. See tedge-zephyr/docs/debugging-against-real-devices.md.
# The system heap is not set here: any CONFIG_HEAP_MEM_POOL_SIZE below the
# drivers' combined minimum (the Wi-Fi driver alone asks for 51,200 B) is
# ignored, and this board's images resolve to about 55 KB whatever the
# application or this file says (the exact sum of the drivers' minimums
# varies a little with the options built). A smaller heap needs
# CONFIG_HEAP_MEM_POOL_IGNORE_MIN and a measured low-water mark
# (reduce-memory-footprint, tier 2).
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=20

CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_ZVFS_OPEN_MAX=14
