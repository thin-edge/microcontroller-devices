#
# ESP32-S3-DevKitC-1 (N16R8) settings for any application built with
# tedge-zephyr. Put after the profile in EXTRA_CONF_FILE.

CONFIG_MBEDTLS_HEAP_SIZE=98304
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384

# --- The TLS heap goes in the board's octal PSRAM ---
# Internal DRAM is too tight for the client next to the application
# otherwise; the S3 linker script already maps .mbedtls_heap into PSRAM
# (c8y-direct-spikes, section 8 follow-up).
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_TYPE_ESPPSRAM64=y
CONFIG_MBEDTLS_HEAP_CUSTOM_SECTION=y

# One TLS context for MQTT, plus one for a remote-access session or download.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2

# A closed TLS connection holds its TCP context for a moment, so the client
# needs headroom over what the application uses.
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_ZVFS_OPEN_MAX=14

# --- What a remote-access tunnel needs beside MQTT ---
# The Wi-Fi driver's receive path runs out of net_bufs under an interactive
# session long before it runs out of bandwidth: at the default 128-byte
# net_buf a 1500-byte frame costs twelve of them, so one burst from a
# repainting terminal empties the pool ("esp32_wifi: Failed to allocate net
# buffer"), frames are dropped and the tunnel's TLS socket times out. This
# board has more headroom than the C6 but the same radio and the same
# default pools. websocket_send_msg() also k_mallocs a masking buffer for
# every frame it sends. See
# tedge-zephyr/docs/debugging-against-real-devices.md.
CONFIG_HEAP_MEM_POOL_SIZE=40960
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_BUF_TX_COUNT=64
