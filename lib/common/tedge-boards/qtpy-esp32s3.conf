#
# Adafruit QT Py ESP32-S3 (N4R2) settings for any application built with
# tedge-zephyr. Put after the profile in EXTRA_CONF_FILE.

CONFIG_MBEDTLS_HEAP_SIZE=98304
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384

# --- The TLS heap goes in the board's quad PSRAM ---
# The N4R2 module has 2 MB of quad PSRAM where the DevKitC has 8 MB octal.
# Without this the 96 KB mbedTLS heap stays in internal DRAM and a Modbus
# image links at 99.8% of it, with 764 bytes to spare. Moving it frees
# 95,968 B and brings the board to 75.8%.
#
# SPIRAM_TYPE_* alone is not enough: it leaves CONFIG_ESP_SPIRAM_SIZE at 0,
# the ext_dram region is empty and the link fails with "External SPIRAM
# overflowed". The size has to be stated.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_QUAD=y
CONFIG_SPIRAM_TYPE_ESPPSRAM16=y
CONFIG_ESP_SPIRAM_SIZE=2097152
CONFIG_MBEDTLS_HEAP_CUSTOM_SECTION=y

# One TLS context for MQTT, plus one for a remote-access session or download.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2

# A closed TLS connection holds its TCP context for a moment, so the client
# needs headroom over what the application uses.
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_ZVFS_OPEN_MAX=14

# --- What a remote-access tunnel needs beside MQTT ---
# The Wi-Fi driver's receive path runs out of net_bufs under an interactive
# session long before it runs out of bandwidth, and websocket_send_msg()
# k_mallocs a masking buffer per frame. Sized as on the C6, which was
# verified against a real htop session. See
# tedge-zephyr/docs/debugging-against-real-devices.md.
# The system heap is not set here: any CONFIG_HEAP_MEM_POOL_SIZE below the
# drivers' combined minimum (the Wi-Fi driver alone asks for 51,200 B) is
# ignored, and this board's images resolve to about 55 KB whatever the
# application or this file says (the exact sum of the drivers' minimums
# varies a little with the options built). A smaller heap needs
# CONFIG_HEAP_MEM_POOL_IGNORE_MIN and a measured low-water mark
# (reduce-memory-footprint, tier 2).
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_BUF_TX_COUNT=64
