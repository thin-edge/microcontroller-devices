#
# ESP32-WROOM-32 DevKitC settings for any application built with
# tedge-zephyr. Put after the profile in EXTRA_CONF_FILE. For the
# ESP32-CAM, which shares this board target but has PSRAM, use
# esp32-cam.conf.
#
# No PSRAM and a 192 KB dram0 segment: the mbedTLS heap has to be small and
# internal. Measured on a WROOM with Modbus (2026-09-21, DEVICES.md):
#   ota profile: 96.3% of dram0; an 800 KB firmware download over HTTPS
#   works with 8 KB records and confirms; 23 KB of system heap stays free.
#   ota + remote access: 99.9% of dram0, 76 B of libc malloc arena left; an
#   SSH tunnel carried 409 KB in 19 s with Modbus served alongside.
#   apps/tedge-agent, ota + remote access + certificate renewal: 99.7%;
#   enrolment, restart, tunnel and firmware update all pass.
# Remote access is not released for this board (2026-09-23): a bulk SSH
# copy works, but htop over a tunnel fails with the receive buffers this
# board has room for (32 x 128 B, about three Wi-Fi frames). The release
# builds are ota (+ certificate renewal on the agent).
# The full profile does not fit, and neither does SNMP or OPC-UA with the
# client at any level.

# --- TCP, which the SNMP-only build switches off ---
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

# 8 KB records: Cumulocity's MQTT chain, its HTTPS binary download and the
# remote-access WebSocket all work at this size (measured). The heap holds
# MQTT plus one download or tunnel at 8 KB records.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=8192
CONFIG_MBEDTLS_HEAP_SIZE=57344
# With 8 KB input records the server has to be told to stay within them:
# the 16 KB profiles switch the fragment-length extension off, this board
# turns it back on (Zephyr advertises 4 KB, as it did before the profiles'
# 4 KB output buffer; see tedge-zephyr/include/tedge/mbedtls_user_config.h).
CONFIG_NET_SOCKETS_TLS_SET_MAX_FRAGMENT_LENGTH=y

# The client heap stays in dram1 (.noinit) here: dram0 also holds the
# mbedTLS heap on this board, and moving the 16 KB client heap there
# overflowed it by 64 B with parameters (2026-09-23). The ESP32-CAM, whose
# mbedTLS heap is in PSRAM, takes the default and has it in dram0.
CONFIG_TEDGE_HEAP_NOINIT=y

# MQTT plus one HTTPS download or one tunnel.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2

# DHCP, DNS, mDNS, the application's listener and a client, MQTT, then a
# tunnel's WebSocket and its LAN target. At the WROOM application default
# of 6 the tunnel request failed at runtime with "Not enough connection
# contexts" although the image linked.
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_ZVFS_OPEN_MAX=14

# Network buffers and the kernel heap stay at the application's WROOM
# values: the measured runs used them, and deeper pools do not fit.
