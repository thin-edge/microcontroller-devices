# SPDX-License-Identifier: Apache-2.0
#
# Adds certificate renewal to the ota profile, for a board whose tedge-ota
# image has room for it (the ESP32-WROOM-32 agent: measured, DEVICES.md).
# Without it a device must be onboarded again before its certificate
# expires.
CONFIG_TEDGE_CERT_RENEWAL=y
# A month of margin covers a device that is offline for a while.
CONFIG_TEDGE_CERT_RENEW_BEFORE_DAYS=30
