# SPDX-License-Identifier: Apache-2.0
#
# Adds one remote-access tunnel to the ota profile, for a board whose
# tedge-ota image has room for it but not for the full profile (the
# ESP32-WROOM-32 with Modbus or the agent: measured, DEVICES.md). The tunnel shares the
# second TLS context with the firmware download; they do not run at once.
CONFIG_TEDGE_REMOTE_ACCESS=y
CONFIG_TEDGE_REMOTE_ACCESS_MAX_SESSIONS=1
# The tunnel's TLS handshake runs on the bridge thread.
CONFIG_TEDGE_REMOTE_ACCESS_STACK_SIZE=8192
