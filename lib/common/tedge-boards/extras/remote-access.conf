# SPDX-License-Identifier: Apache-2.0
#
# Adds one remote-access tunnel to the ota profile, for a board whose
# tedge-ota image has room for it but not for the full profile. The tunnel
# shares the second TLS context with the firmware download; they do not run
# at once.
#
# Not for the ESP32-WROOM-32: it links there and carries a bulk SSH copy,
# but its 32 x 128 B receive buffers hold about three Wi-Fi frames, and an
# interactive session (htop) fails on "esp32_wifi: Failed to allocate net
# buffer" (2026-09-23, DEVICES.md). An interactive tunnel needs about 16
# frames of buffering (96 x 256 B on the C6), about 15 KB more than the
# WROOM has left.
CONFIG_TEDGE_REMOTE_ACCESS=y
CONFIG_TEDGE_REMOTE_ACCESS_MAX_SESSIONS=1
# The tunnel's TLS handshake runs on the bridge thread.
CONFIG_TEDGE_REMOTE_ACCESS_STACK_SIZE=8192
