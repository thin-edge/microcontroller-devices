#
# The cloud's shell command (c8y_Command, CONFIG_TEDGE_SHELL_COMMAND), for
# general checks on a device in the field. Added to the tedge-full builds that
# have room for it (release/devices.yml, measured in DEVICES.md).
#
# A command runs in-process against a capture backend; there is no shell on
# the console or the network. Nothing outside this list runs, and a request
# that could chain a second command is refused whatever the list says. Every
# entry is read-only and returns within the command timeout.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_KERNEL_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_TEDGE_SHELL_COMMAND=y
#   kernel uptime / kernel version   how long it has run, what it runs
#   net iface / net conn             addresses, gateway, open sockets
#   wifi status                      SSID, RSSI, channel, security
#   tedge params list / tedge diag   the client's parameter sets and state
# Not `net ping`: Zephyr prints the replies after the command has returned,
# so all the cloud would see is the "PING <host>" line.
CONFIG_TEDGE_SHELL_COMMAND_ALLOW_LIST="kernel uptime,kernel version,net iface,net conn,wifi status,tedge params list,tedge diag"
