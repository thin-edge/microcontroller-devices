# SPDX-License-Identifier: Apache-2.0
#
# Adds parameters to the ota profile: settings an operator changes from the
# cloud, stored on the device and reported as twin state. With the Modbus
# application that is the `pump` set (telemetry interval, on/off, type) and
# the `control` set (running, mode, speed_setpoint, and whether Modbus
# clients may still change them), besides the client's own `tedge` set.
#
# Costs 6 KB of RAM on the ESP32-WROOM-32 (the client's private heap
# defaults to 16 KB with parameters, 10 KB without) and 6 KB of flash
# (2026-09-23): dram1 76.6 -> 82.9 %, malloc arena 17.4 -> 16.3 KB.
CONFIG_TEDGE_PARAMETERS=y
