#
# Adds log upload to the ota profile: the cloud asks for a log (the client's
# own, or one the application registers, e.g. Modbus's "app-status") and the
# device sends it over HTTPS. The upload runs on its own thread with an
# 8 KB stack (its TLS handshake overflowed 4 KB), which is what it costs in
# RAM. On the ESP32-CAM it fits beside SNMP only since the client's heap
# moved out of dram1 (2026-09-23).
CONFIG_TEDGE_LOG_UPLOAD=y
