# Parameters are implemented, so they need no experimental flag. A change
# travels inside its operation, so unlike the file-transfer features this
# one pulls in no HTTP client. The schema printer follows the shell.
# expect: CONFIG_TEDGE_PARAMETERS=y
# expect: CONFIG_TEDGE_EXPERIMENTAL_FEATURES=n
# expect: CONFIG_TEDGE_PARAMETERS_MAX=16
# expect: CONFIG_TEDGE_PARAMETERS_SCHEMA=y
# The client's own set comes with parameters, and can be declined.
# expect: CONFIG_TEDGE_PARAMETERS_SELF=y
# expect: CONFIG_TEDGE_HTTP=n
CONFIG_SHELL=y
CONFIG_TEDGE_PARAMETERS=y
