# Log upload and the shell command are implemented, so neither needs the
# experimental flag. Log upload brings in the HTTP client and the client's
# own log; the shell command refuses everything until told otherwise.
# expect: CONFIG_TEDGE_LOG_UPLOAD=y
# expect: CONFIG_TEDGE_SHELL_COMMAND=y
# expect: CONFIG_TEDGE_EXPERIMENTAL_FEATURES=n
# expect: CONFIG_TEDGE_HTTP=y
# expect: CONFIG_HTTP_CLIENT=y
# expect: CONFIG_TEDGE_LOG_RING_BYTES=2048
# expect: CONFIG_TEDGE_LOG_UPLOAD_STACK_SIZE=8192
# expect: CONFIG_TEDGE_SHELL_COMMAND_ALLOW_LIST=""
# expect: CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL=y
CONFIG_TEDGE_LOG_UPLOAD=y
CONFIG_TEDGE_SHELL_COMMAND=y
