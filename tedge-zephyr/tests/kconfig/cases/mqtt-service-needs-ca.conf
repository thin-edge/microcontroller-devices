# Asking for the MQTT Service with basic auth is refused; Core MQTT is used
# instead. For a choice member, Kconfig names the option it chose rather
# than the unmet dependency.
# expect: CONFIG_TEDGE_C8Y_MQTT_SERVICE=n
# expect: CONFIG_TEDGE_C8Y_CORE_MQTT=y
# expect-warning: TEDGE_C8Y_MQTT_SERVICE .*but TEDGE_C8Y_CORE_MQTT .*ended up as the choice selection
CONFIG_TEDGE_AUTH_BOOTSTRAP=y
CONFIG_TEDGE_C8Y_MQTT_SERVICE=y
