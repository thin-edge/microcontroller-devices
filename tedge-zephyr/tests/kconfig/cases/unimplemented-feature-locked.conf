# Without TEDGE_EXPERIMENTAL_FEATURES, unimplemented features can't be
# selected. The thin-edge.io gateway transport is the last one left, and
# because it is a member of the transport choice rather than a standalone
# option, Kconfig reports the refusal as the choice falling back to the
# transport that is implemented, not as an unmet dependency.
# expect: CONFIG_TEDGE_TRANSPORT_GATEWAY=n
# expect: CONFIG_TEDGE_TRANSPORT_C8Y=y
# expect-warning: choice symbol TEDGE_TRANSPORT_GATEWAY .*but TEDGE_TRANSPORT_C8Y .*ended up as the choice selection
CONFIG_TEDGE_TRANSPORT_GATEWAY=y
