# Remote access resolves ".local" targets over mDNS by default, with a 5 s
# lookup tried up to three times.
# expect: CONFIG_TEDGE_REMOTE_ACCESS_MDNS=y
# expect: CONFIG_TEDGE_REMOTE_ACCESS_RESOLVE_TIMEOUT_MS=5000
# expect: CONFIG_TEDGE_REMOTE_ACCESS_RESOLVE_ATTEMPTS=3
# expect: CONFIG_TEDGE_REMOTE_ACCESS_RESOLVE_RETRY_DELAY_MS=500
# The client sends its own query: Zephyr's mDNS resolver and static DNS
# servers stay out.
# expect: CONFIG_MDNS_RESOLVER=n
# expect: CONFIG_DNS_SERVER_IP_ADDRESSES=n
CONFIG_TEDGE_EXPERIMENTAL_FEATURES=y
CONFIG_TEDGE_REMOTE_ACCESS=y
