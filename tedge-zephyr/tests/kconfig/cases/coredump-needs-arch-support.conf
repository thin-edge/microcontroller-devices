# Crash dumps need an architecture that can take one; where Zephyr cannot,
# the option is not selectable rather than breaking the build.
# expect: CONFIG_TEDGE_COREDUMP=n
# expect: CONFIG_TEDGE_LOG_UPLOAD=y
# expect-warning: TEDGE_COREDUMP .*ARCH_SUPPORTS_COREDUMP
CONFIG_TEDGE_LOG_UPLOAD=y
CONFIG_TEDGE_COREDUMP=y
