#
# tedge-zephyr profile: ota. The smallest image that can still be updated
# over the air: connection, inventory, availability, health, telemetry,
# restart and firmware update. Firmware update downloads over HTTPS beside
# the MQTT session, so this profile budgets two concurrent TLS sessions.
#
# Measured (firmware-release-workflow, 2026-09-21):
#   ESP32-WROOM-32 + Modbus, 8 KB TLS records, 56 KB mbedTLS heap in
#   internal DRAM: links at 96.3% of dram0; an 800 KB image downloads in
#   32 s and confirms; 23 KB of system heap stays free.
#   MQTT + one HTTPS download with 16 KB records: 90.9 KB TLS heap peak
#   (ESP32-C6, the full profile's measurement).
#   Run on the ESP32-C6, S3-DevKitC, QT Py S3 and ESP32-CAM with Modbus,
#   SNMP and no protocol: every image downloaded, installed and confirmed
#   the next over the air (52-94 s). OPC-UA beside it runs out of memory on
#   the C6 and the S3-DevKitC.
# A board without PSRAM may need smaller records and heap: the board's
# settings file overrides the two sizes below.

CONFIG_TEDGE=y
CONFIG_TEDGE_TRANSPORT_C8Y=y
CONFIG_TEDGE_C8Y_MQTT_SERVICE=y
CONFIG_TEDGE_AUTH_C8Y_CA=y

CONFIG_TEDGE_TELEMETRY=y
CONFIG_TEDGE_HEALTH=y
CONFIG_TEDGE_RESTART=y
CONFIG_TEDGE_FIRMWARE_UPDATE=y
# The download's TLS handshake runs on its own thread.
CONFIG_TEDGE_FIRMWARE_STACK_SIZE=8192

CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
# MQTT plus one HTTPS download: 90.9 KB peak measured, plus margin.
CONFIG_MBEDTLS_HEAP_SIZE=98304
# --- What the application must provide (see tedge-zephyr/README.md) ---
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
# The device key lives in PSA ITS; the store is a Kconfig choice, so the
# module cannot select it.
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y

# Concurrent TLS: MQTT + the HTTPS download.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
# Headroom for reconnects (a closed TLS connection holds its TCP context
# until it finishes closing).
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=12
