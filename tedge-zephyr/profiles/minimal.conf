#
# tedge-zephyr profile: minimal (DRAFT). Direct to Cumulocity with one TLS
# session: connection, inventory, availability, health and restart. No HTTP
# client, no firmware update, no remote access.
#
# Measured cost of this level (c8y-direct-spikes, Spike A, ESP32-C6):
#   one TLS session: 51.8 KB peak / 34.8 KB connected with 16 KB buffers,
#   35.4 KB / 18.5 KB with 8 KB buffers (MQTT Service only)
# Until the features are implemented in the module, the feature options below
# are only selectable with CONFIG_TEDGE_EXPERIMENTAL_FEATURES=y.

CONFIG_TEDGE=y
CONFIG_TEDGE_TRANSPORT_C8Y=y
CONFIG_TEDGE_C8Y_MQTT_SERVICE=y
CONFIG_TEDGE_AUTH_C8Y_CA=y

CONFIG_TEDGE_RESTART=y
CONFIG_TEDGE_HEALTH=y
CONFIG_TEDGE_TELEMETRY=y

# One session at a time; 16 KB TLS buffers are the safe default (8 KB works
# on the MQTT Service today but leaves ~2 KB margin over its certificate chain).
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
