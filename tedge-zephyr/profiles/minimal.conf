# SPDX-License-Identifier: Apache-2.0
#
# tedge-zephyr profile: minimal (DRAFT). Direct to Cumulocity with one TLS
# session: connection, inventory, availability, health and restart. No HTTP
# client, no firmware update, no remote access.
#
# Measured cost of this level (c8y-direct-spikes, Spike A, ESP32-C6):
#   one TLS session: 51.8 KB peak / 34.8 KB connected with 16 KB buffers,
#   35.4 KB / 18.5 KB with 8 KB buffers (MQTT Service only)
#   private client heap: CONFIG_TEDGE_HEAP_SIZE defaults to 10 KB here
#   (no parameters); the health free-heap value shows the margin.
# Every feature here is implemented, so nothing in this profile needs
# CONFIG_TEDGE_EXPERIMENTAL_FEATURES.

CONFIG_TEDGE=y
CONFIG_TEDGE_TRANSPORT_C8Y=y
CONFIG_TEDGE_C8Y_MQTT_SERVICE=y
CONFIG_TEDGE_AUTH_C8Y_CA=y

CONFIG_TEDGE_RESTART=y
CONFIG_TEDGE_HEALTH=y
CONFIG_TEDGE_TELEMETRY=y
# A device that reports a few series every minute needs less than the default
# 2 KB of buffer; the trade is how long an outage it can ride out.
CONFIG_TEDGE_TELEMETRY_BUFFER_BYTES=1024

# One session at a time; 16 KB TLS buffers are the safe default (8 KB works
# on the MQTT Service today but leaves ~2 KB margin over its certificate chain).
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
# One session: 51.8 KB peak / 34.8 KB connected, plus the enrollment request.
CONFIG_MBEDTLS_HEAP_SIZE=65536
# Split TLS record buffers: the output buffer is 4 KB (the client only sends
# small records), the input buffer stays at the size above. Saves 12 KB of
# mbedTLS heap per concurrent session at 16 KB records. The fragment-length
# option stays off so the server's records are what they were: with it on,
# Zephyr would advertise the smaller buffer (4 KB) as the maximum. See
# tedge-zephyr/include/tedge/mbedtls_user_config.h.
CONFIG_MBEDTLS_USER_CONFIG_FILE="tedge/mbedtls_user_config.h"
CONFIG_NET_SOCKETS_TLS_SET_MAX_FRAGMENT_LENGTH=n
# --- What the application must provide (see tedge-zephyr/README.md) ---
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# AES T-tables in flash instead of 8 KB of .bss (with FEWER_TABLES, which
# Zephyr defaults on, 2.5 KB of flash); a little slower AES, irrelevant
# beside Wi-Fi throughput (reduce-memory-footprint, tier 1).
CONFIG_MBEDTLS_AES_ROM_TABLES=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
# The device key lives in PSA ITS; the store is a Kconfig choice, so the
# module cannot select it.
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y

