# SPDX-License-Identifier: Apache-2.0
#
# tedge-zephyr profile: remote-access enabler (DRAFT). A device whose only job
# is to let Cumulocity reach hosts on its LAN (SSH, web UIs): connection,
# health, restart and one remote-access tunnel, onboarded through the
# Cumulocity CA. No firmware update over HTTPS (a second concurrent TLS
# session), no protocol app.
#
# Measured (c8y-direct-spikes, section 8 follow-up, ESP32-WROOM-32 spike):
#   MQTT + one tunnel with 8 KB records: 53.4 KB TLS heap peak, 36.4 KB
#   connected; 2.8 KB of libc heap left on the WROOM after trimming the
#   Wi-Fi heap. The WROOM tunnel is slow (~4-17 KB/s) and stalled once (P13):
#   prefer an ESP32-C6 or S3 for this role.
#   private client heap: CONFIG_TEDGE_HEAP_SIZE defaults to 10 KB here
#   (no parameters); the health free-heap value shows the margin.
# 8 KB records leave ~2 KB of margin over today's 9883 chain (P3).

CONFIG_TEDGE=y
CONFIG_TEDGE_TRANSPORT_C8Y=y
CONFIG_TEDGE_C8Y_MQTT_SERVICE=y
CONFIG_TEDGE_AUTH_C8Y_CA=y

CONFIG_TEDGE_HEALTH=y
CONFIG_TEDGE_RESTART=y
CONFIG_TEDGE_REMOTE_ACCESS=y
CONFIG_TEDGE_REMOTE_ACCESS_MAX_SESSIONS=1
CONFIG_TEDGE_REMOTE_ACCESS_STACK_SIZE=8192

CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=8192
CONFIG_MBEDTLS_HEAP_SIZE=57344
# Split TLS record buffers: the output buffer is 4 KB (the client only sends
# small records), the input buffer stays at 8 KB. Saves 4 KB of mbedTLS heap
# per concurrent session. The fragment-length option stays on: with 8 KB
# records the server has to be told to stay within the input buffer (Zephyr
# advertises 4 KB, the largest RFC 6066 code below 8 KB, as it did before).
# See tedge-zephyr/include/tedge/mbedtls_user_config.h.
CONFIG_MBEDTLS_USER_CONFIG_FILE="tedge/mbedtls_user_config.h"
CONFIG_NET_SOCKETS_TLS_SET_MAX_FRAGMENT_LENGTH=y
# --- What the application must provide (see tedge-zephyr/README.md) ---
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# AES T-tables in flash instead of 8 KB of .bss (with FEWER_TABLES, which
# Zephyr defaults on, 2.5 KB of flash); a little slower AES, irrelevant
# beside Wi-Fi throughput (reduce-memory-footprint, tier 1).
CONFIG_MBEDTLS_AES_ROM_TABLES=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
# The device key lives in PSA ITS; the store is a Kconfig choice, so the
# module cannot select it.
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y

# MQTT + the tunnel's WebSocket.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
# At 32 RX / 24 TX the tunnel exhausted the TX pool on the WROOM.
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
