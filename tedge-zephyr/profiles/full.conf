#
# tedge-zephyr profile: full (DRAFT). Every feature, for boards with room:
# ESP32-C6 and ESP32-S3 in c8y-direct-spikes.
#
# Measured cost (ESP32-C6, 16 KB TLS buffers):
#   MQTT + one HTTPS download: 90.9 KB TLS heap peak
#   MQTT + one remote-access tunnel: 69.2 KB connected, 86.2 KB peak
#   signed image with A+B+C+F: 960 KB of the 1280 KB slot
# Until the features are implemented in the module, the feature options below
# are only selectable with CONFIG_TEDGE_EXPERIMENTAL_FEATURES=y.

CONFIG_TEDGE=y
CONFIG_TEDGE_TRANSPORT_C8Y=y
CONFIG_TEDGE_C8Y_MQTT_SERVICE=y
CONFIG_TEDGE_AUTH_C8Y_CA=y

CONFIG_TEDGE_TELEMETRY=y
CONFIG_TEDGE_HEALTH=y
CONFIG_TEDGE_RESTART=y
CONFIG_TEDGE_FIRMWARE_UPDATE=y
CONFIG_TEDGE_SHELL_COMMAND=y
CONFIG_TEDGE_LOG_UPLOAD=y
CONFIG_TEDGE_REMOTE_ACCESS=y
CONFIG_TEDGE_REMOTE_ACCESS_MAX_SESSIONS=1
CONFIG_TEDGE_CONFIG=y
CONFIG_TEDGE_CERT_RENEWAL=y

CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
# Concurrent TLS: MQTT + an HTTPS transfer or a remote-access tunnel.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=3
# Headroom for reconnects (a closed TLS connection holds its TCP context
# until it finishes closing).
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=12
