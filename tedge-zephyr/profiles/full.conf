#
# tedge-zephyr profile: full (DRAFT). Every feature, for boards with room:
# ESP32-C6 and ESP32-S3 in c8y-direct-spikes.
#
# Measured cost (ESP32-C6, 16 KB TLS buffers):
#   MQTT + one HTTPS download: 90.9 KB TLS heap peak (measured)
#   MQTT + one remote-access tunnel: 69.2 KB connected, 86.2 KB peak
#   signed image with A+B+C+F: 960 KB of the 1280 KB slot
#   parameters: +7.2 KB, and +1.3 KB more for the schema printer, which is
#   only needed until the sets are registered in the tenant
# Every feature here is implemented, so this profile needs no experimental
# gate; the only option still behind one is the thin-edge.io gateway
# transport, which this profile does not use.

CONFIG_TEDGE=y
CONFIG_TEDGE_TRANSPORT_C8Y=y
CONFIG_TEDGE_C8Y_MQTT_SERVICE=y
CONFIG_TEDGE_AUTH_C8Y_CA=y

CONFIG_TEDGE_TELEMETRY=y
CONFIG_TEDGE_HEALTH=y
CONFIG_TEDGE_RESTART=y
CONFIG_TEDGE_FIRMWARE_UPDATE=y
# The download's TLS handshake runs on its own thread, as the tunnel's does.
CONFIG_TEDGE_FIRMWARE_STACK_SIZE=8192
CONFIG_TEDGE_SHELL_COMMAND=y
# Nothing runs until the integrator lists what may; see the README.
CONFIG_TEDGE_SHELL_COMMAND_ALLOW_LIST=""
CONFIG_TEDGE_LOG_UPLOAD=y
# Crash dumps also need the application's backend choice:
#   CONFIG_DEBUG_COREDUMP_BACKEND_FLASH_PARTITION=y
#   CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
CONFIG_TEDGE_COREDUMP=y
CONFIG_TEDGE_REMOTE_ACCESS=y
CONFIG_TEDGE_REMOTE_ACCESS_MAX_SESSIONS=1
# The tunnel's TLS handshake runs on the bridge thread.
CONFIG_TEDGE_REMOTE_ACCESS_STACK_SIZE=8192
CONFIG_TEDGE_PARAMETERS=y
CONFIG_TEDGE_CERT_RENEWAL=y
# A month of margin covers a device that is offline for a while.
CONFIG_TEDGE_CERT_RENEW_BEFORE_DAYS=30

CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
# MQTT plus one transfer or tunnel: 90.9 KB peak measured, plus margin. On the
# ESP32-S3 add CONFIG_MBEDTLS_HEAP_CUSTOM_SECTION=y and CONFIG_ESP_SPIRAM=y to
# put this heap in PSRAM.
CONFIG_MBEDTLS_HEAP_SIZE=98304
# --- What the application must provide (see tedge-zephyr/README.md) ---
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
# The device key lives in PSA ITS; the store is a Kconfig choice, so the
# module cannot select it.
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y

# Concurrent TLS: MQTT + an HTTPS transfer or a remote-access tunnel.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=3
# Headroom for reconnects (a closed TLS connection holds its TCP context
# until it finishes closing).
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=12
