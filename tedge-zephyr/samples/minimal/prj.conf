#
# The smallest application that hosts the client. The client itself only
# needs CONFIG_TEDGE; what the *application* must provide for the Cumulocity
# transport (mbedTLS, a settings backend, socket budget) is in
# overlay-c8y.conf, so build this sample with:
#
#   west build -b <board> samples/minimal -- -DEXTRA_CONF_FILE=overlay-c8y.conf

CONFIG_TEDGE=y
CONFIG_LOG=y

