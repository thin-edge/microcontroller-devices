schema: spec-driven

context: |
  Domain: Ready-to-use microcontroller (MCU) firmware built on Zephyr RTOS
  that turns a device into an industrial-protocol data source — first an
  OPC-UA server, later other industry protocols. A separate collector/
  gateway device pulls data off these MCUs over that industrial protocol.
  The MCU is the source; it does not do the collecting.

  The repo is also a learning vehicle for Zephyr RTOS and MCUs generally.

  Phasing (respect the ordering):
    1. Industrial-protocol source firmware — Zephyr-based OPC-UA server
       serving device/sensor data to an external client. (Done.)
    2. Additional industry protocols as source options (Modbus TCP, SNMP;
       done), plus deployability: BLE Wi-Fi provisioning and the MCUboot
       A/B layout.
    3. Started 2026-09-19: tedge-zephyr, a thin-edge.io device-management
       client shipped as a reusable Zephyr module (`tedge-zephyr/`, API
       `tedge_*`, Kconfig `CONFIG_TEDGE_*`) that ANY user's Zephyr
       application can include. This repo's protocol apps are example user
       applications. The module must never depend on `lib/` or `apps/`, and
       must stay ready to move into its own repository. It connects directly
       to Cumulocity first (MQTT Service :9883, SmartREST 2.0; onboarding
       via the Cumulocity CA); remote access, including forwarding to other
       LAN hosts, is the headline feature. The thin-edge.io gateway
       transport comes later. Roadmap: SCOPE.md, "Phase 3 roadmap". Every
       feature is selected at build time so constrained boards include only
       what fits; see the device-management-features and
       tedge-client-module specs.

  Design priorities (in order):
    1. Fit constrained MCU resources (flash, RAM, no/limited filesystem).
    2. Reusability — easy to flash and configure across Zephyr boards.
    3. Correct, interoperable industrial-protocol behavior (spec-compliant
       OPC-UA that standard clients can discover and read).

  Conventions:
    - Firmware targets Zephyr RTOS (C, Zephyr build system / west).
    - Prefer portability across Zephyr-supported boards over board-specific
      hacks.

rules:
  proposal:
    - State which industrial protocol and Zephyr board(s) the change targets.
    - Include a "Non-goals" section.
    - Call out MCU resource constraints (flash/RAM) the design must fit.
    - Note which phase (1/2/3) the change belongs to. Phase 1/2 changes
      keep thin-edge.io/Cumulocity out of scope.
    - For Phase 3 changes, list the Kconfig options the change adds, and
      their measured flash/RAM cost per target board.
    - For Phase 3 changes, state any change to the public `tedge_*` API and
      keep host-app glue out of `tedge-zephyr/`.
  tasks:
    - Break tasks into chunks of at most ~2 hours.
    - Separate firmware (device/source) work from client/collector work.
