# SPDX-License-Identifier: Apache-2.0
#
# Keep a release PR open with the next version (every apps/*/VERSION) and the
# changelog, worked out from the Conventional Commits on main. Merging it tags
# the merge commit and leaves a draft release carrying the changelog; the
# firmware job then builds that tag with release.yml, which attaches the
# images and publishes the draft only if every build succeeded. See
# release-please-config.json and README.md, "Releasing".
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  firmware:
    name: Firmware
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
