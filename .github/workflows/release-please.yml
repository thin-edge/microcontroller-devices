# SPDX-License-Identifier: Apache-2.0
#
# Keep a release PR open with the next version (every apps/*/VERSION) and the
# changelog, worked out from the Conventional Commits on main. Merging it tags
# the merge commit and leaves a draft release carrying the changelog; the tag
# starts release.yml, which attaches the images and publishes the draft only
# if every build succeeded. See release-please-config.json and README.md,
# "Releasing".
#
# It runs as COMMUNITY_ACTIONS_PAT, not GITHUB_TOKEN: a tag or PR created with
# GITHUB_TOKEN starts no workflow, so the tag would not build and the release
# PR would get no checks.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.COMMUNITY_ACTIONS_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

