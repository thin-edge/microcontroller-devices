# SPDX-License-Identifier: Apache-2.0
#
# Pull requests are squash-merged with their title as the commit message, and
# release-please reads that message to pick the next version and write the
# changelog. A title that is not a Conventional Commit would drop the change
# from both, so check it here. See README.md, "Releasing".
name: pr-title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            test
            build
            ci
            chore
